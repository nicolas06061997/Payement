<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Payement</title>
<meta name="theme-color" content="#b23a48">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Payement">
<style>
:root{
  --bg:#fbf5f3;--card:#ffffff;--ink:#2a1e22;--mute:#8a7a7f;--line:#eee2e0;
  --brand:#b23a48;--brand2:#e07a5f;--soft:#f8e3e3;
  --in:#2e8b57;--out:#c0392b;--sav:#3a6fb2;--warn:#d98a00;
  --shadow:0 2px 10px rgba(90,40,50,.08);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#1a1416;--card:#251d20;--ink:#f3e9eb;--mute:#a8999d;--line:#3a2e32;
  --brand:#e05a6a;--brand2:#f08a6f;--soft:#3a2328;
  --in:#4fc283;--out:#ff6f61;--sav:#6fa0e8;--warn:#f0b040;
  --shadow:0 2px 10px rgba(0,0,0,.3);
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
header{position:sticky;top:0;z-index:5;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;
  padding:calc(10px + env(safe-area-inset-top)) 16px 12px;box-shadow:var(--shadow)}
header h1{margin:0 0 6px;font-size:20px;font-weight:700;letter-spacing:.3px}
.month{display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,.18);border-radius:12px;padding:4px}
.month button{width:40px;height:36px;font-size:22px;border-radius:10px;color:#fff}
.month button:active{background:rgba(255,255,255,.25)}
.month span{font-weight:600;text-transform:capitalize}
main{max-width:640px;margin:0 auto;padding:14px 16px}
.card{background:var(--card);border-radius:16px;padding:14px 16px;margin-bottom:12px;box-shadow:var(--shadow)}
.card h2{margin:0 0 10px;font-size:16px}
.big{text-align:center;padding:20px 16px}
.big .lbl{color:var(--mute);font-size:14px}
.big .val{font-size:38px;font-weight:800;margin:4px 0}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .l{display:flex;align-items:center;gap:10px;min-width:0}
.row .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .sub{color:var(--mute);font-size:13px}
.ico{width:36px;height:36px;border-radius:10px;background:var(--soft);display:grid;place-items:center;font-size:18px;flex:none}
.amt{font-weight:700;white-space:nowrap}
.in{color:var(--in)}.out{color:var(--out)}.sav{color:var(--sav)}.warn{color:var(--warn)}.mute{color:var(--mute)}
.tap{cursor:pointer}.tap:active{opacity:.6}
.chk{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;font-size:15px}
.chk.on{background:var(--in);border-color:var(--in);color:#fff}
.done .nm{text-decoration:line-through;color:var(--mute)}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin:8px 0 4px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--brand2),var(--brand));border-radius:6px}
.bar.g i{background:linear-gradient(90deg,#6fcf97,var(--in))}
.btns{display:flex;gap:10px;margin-bottom:12px}
.btn{flex:1;padding:13px 10px;border-radius:14px;background:var(--brand);color:#fff;font-weight:600;box-shadow:var(--shadow)}
.btn.alt{background:var(--card);color:var(--ink)}
.btn.in{background:var(--in);color:#fff}.btn.out{background:var(--out);color:#fff}
.btn.small{flex:none;padding:8px 14px;font-size:14px;border-radius:10px}
.btn:active{transform:scale(.97)}
.empty{text-align:center;color:var(--mute);padding:16px 6px;font-size:15px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.mini{background:var(--card);border-radius:14px;padding:12px;box-shadow:var(--shadow)}
.mini .lbl{font-size:13px;color:var(--mute)}.mini .amt{font-size:19px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);
  display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:8px 2px 9px;font-size:11px;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button b{font-size:22px;font-weight:400;filter:grayscale(1);opacity:.7}
nav button.on{color:var(--brand);font-weight:600}
nav button.on b{filter:none;opacity:1}
/* fenêtre */
#modal{position:fixed;inset:0;z-index:10;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center}
#modal.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:640px;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));
  max-height:92vh;overflow:auto;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet h3{margin:0 0 14px;font-size:19px}
.f{margin-bottom:12px}
.f label{display:block;font-size:14px;color:var(--mute);margin-bottom:4px}
.f input,.f select{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:17px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{padding:8px 12px;border-radius:20px;background:var(--bg);border:1px solid var(--line);font-size:14px}
.chips button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.sheet .btns{margin:16px 0 0}
.del{color:var(--out);width:100%;padding:12px;margin-top:8px;font-weight:600}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#2a1e22;color:#fff;
  padding:10px 18px;border-radius:20px;font-size:14px;z-index:20;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:1}
textarea{width:100%;min-height:90px;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:13px monospace}
.cat{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:14px}
.cat .bar{flex:1;margin:0;height:8px}
.cat .amt{min-width:80px;text-align:right;font-size:14px}
p.help{color:var(--mute);font-size:14px;margin:4px 0 10px}
header h1{display:flex;align-items:center;gap:8px}
.sy{margin-left:auto;font-size:12px;font-weight:600;background:rgba(255,255,255,.2);padding:4px 10px;border-radius:12px}
#upd{position:fixed;left:12px;right:12px;bottom:calc(86px + env(safe-area-inset-bottom));z-index:9;display:none;gap:10px;align-items:center;background:var(--brand);color:#fff;
  padding:14px 14px 14px 16px;border-radius:18px;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:620px;margin:0 auto}
#upd.on{display:flex}#upd>div{flex:1;line-height:1.3}#upd small{display:block;opacity:.9;font-size:13px}
#upd button{background:#fff;color:var(--brand);font-weight:800;border-radius:12px;padding:10px 14px;white-space:nowrap}
#ins{position:fixed;inset:0;z-index:30;background:linear-gradient(160deg,var(--soft),var(--bg) 55%);display:none;flex-direction:column;justify-content:center;
  padding:calc(24px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom));overflow:auto}
#ins.on{display:flex}#insc{max-width:460px;margin:0 auto;width:100%}
#ins h2{font-size:28px;margin:0 0 10px}#ins p{font-size:17px;margin:0 0 16px}
#ins .btn{display:block;width:100%;font-size:18px;padding:16px;margin:8px 0}
#ins .st{display:flex;gap:14px;align-items:center;background:var(--card);border-radius:18px;padding:14px;margin:10px 0;box-shadow:var(--shadow);font-size:17px}
#ins .st .num{font-weight:800;flex:none;width:36px;height:36px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center}
#ins .later{margin:18px auto 0;color:var(--mute);font-weight:700;padding:10px}
</style>
</head>
<body>
<header>
  <h1>💶 Payement <span id="sy" class="sy">☁️ …</span></h1>
  <div class="month"><button id="prev" aria-label="Mois précédent">‹</button><span id="mlbl"></span><button id="next" aria-label="Mois suivant">›</button></div>
</header>
<main id="main"></main>
<nav id="nav"></nav>
<div id="modal"><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>
<div id="upd"><div><b>🎉 Nouvelle mise à jour disponible</b><small id="updn"></small></div><button onclick="location.reload()">Mettre à jour</button></div>
<div id="ins"><div id="insc"></div><button class="later" onclick="insLater()">Plus tard</button></div>

<script>
'use strict';
const APPV = '2026-11-09.2';
const KEY = 'pay_save';

// ---------- Catégories ----------
const CATS_OUT = [['courses','🛒','Courses'],['maison','🏠','Maison'],['voiture','🚗','Voiture'],['enfants','🧸','Enfants'],
  ['sante','💊','Santé'],['loisirs','🎉','Loisirs'],['resto','🍔','Resto'],['vetements','👕','Vêtements'],['cadeaux','🎁','Cadeaux'],['autre','📦','Autre']];
const CATS_IN = [['salaire','💼','Salaire'],['aide','👶','Allocations'],['vente','🏷️','Vente'],['cadeau','🎁','Cadeau'],['autre','💰','Autre']];
const CATS_BILL = [['loyer','🏠','Loyer / prêt'],['energie','⚡','Gaz / électricité'],['eau','💧','Eau'],['internet','📶','Internet / GSM'],
  ['assurance','🛡️','Assurance'],['voiture','🚗','Voiture'],['abonnement','📺','Abonnement'],['credit','🏦','Crédit'],['creche','🧸','Crèche / école'],['autre','🧾','Autre']];
const GOAL_ICO = ['💍','🏡','🚗','✈️','👶','🛋️','🎄','🐷','🎓','💻'];
const FREQ = [[1,'Chaque mois'],[2,'Tous les 2 mois'],[3,'Tous les 3 mois'],[6,'Tous les 6 mois'],[12,'Une fois par an']];
const ico = (list, k) => (list.find(c => c[0] === k) || list[list.length - 1])[1];
const catName = (list, k) => (list.find(c => c[0] === k) || list[list.length - 1])[2];

// ---------- Sauvegarde ----------
function blank(){ return { sv:2, bills:[], paid:{}, inc:[], mv:[], goals:[], dep:[], gone:{} }; }
function load(){
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.sv) return upg(Object.assign(blank(), s)); } catch(e) {}
  return blank();
}
// Ancienne version (sv 1) : factures payées rangées par mois en liste -> carte "mois_id" = {v,u}.
function upg(s){
  if (s.sv < 2) {
    const p = {}, n = Date.now();
    for (const m in s.paid) if (Array.isArray(s.paid[m])) s.paid[m].forEach(id => p[m + '_' + id] = { v: true, u: n });
    s.paid = p; ['bills','inc','mv','goals','dep'].forEach(k => s[k].forEach(x => x.u = x.u || n)); s.sv = 2;
  }
  return s;
}
let st = load();
function saveLocal(){ try { localStorage.setItem(KEY, JSON.stringify(st)); } catch(e) { toast('⚠️ Impossible d\'enregistrer'); } }
let pushT;
function save(){ saveLocal(); clearTimeout(pushT); pushT = setTimeout(sync, 500); }
const gone = id => { st.gone[id] = Date.now(); };
const touch = x => { x.u = Date.now(); return x; };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

// ---------- Dates & montants ----------
const pad = n => String(n).padStart(2, '0');
const now = new Date();
const thisMonth = now.getFullYear() + '-' + pad(now.getMonth() + 1);
const today = thisMonth + '-' + pad(now.getDate());
let cur = thisMonth, tab = 'home';
const mi = m => { const [y, mo] = m.split('-').map(Number); return y * 12 + mo - 1; };
const fromMi = i => Math.floor(i / 12) + '-' + pad(i % 12 + 1);
const mName = m => new Date(+m.slice(0, 4), +m.slice(5, 7) - 1, 1).toLocaleDateString('fr-BE', { month:'long', year:'numeric' });
const EUR = new Intl.NumberFormat('fr-BE', { style:'currency', currency:'EUR' });
const eur = n => EUR.format(Math.round(n * 100) / 100);
const num = s => { const v = parseFloat(String(s).replace(/\s/g, '').replace(',', '.')); return isFinite(v) ? Math.round(v * 100) / 100 : NaN; };
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const dShort = d => new Date(d + 'T12:00').toLocaleDateString('fr-BE', { day:'numeric', month:'short' });

// ---------- Calculs ----------
function due(b, m){
  const d = mi(m) - mi(b.start);
  if (d < 0) return false;
  if (b.end && mi(m) > mi(b.end)) return false;
  return d % (b.freq || 1) === 0;
}
const billsOf = m => st.bills.filter(b => due(b, m)).sort((a, b) => (a.day || 0) - (b.day || 0));
const isPaid = (b, m) => !!(st.paid[m + '_' + b.id] || {}).v;
const incOf = m => st.inc.filter(i => mi(m) >= mi(i.start) && !(i.end && mi(m) > mi(i.end)));
const mvOf = m => st.mv.filter(v => v.d.slice(0, 7) === m).sort((a, b) => b.d.localeCompare(a.d));
const depOf = m => st.dep.filter(v => v.d.slice(0, 7) === m);
const goalSaved = g => st.dep.filter(d => d.g === g.id).reduce((s, d) => s + d.amt, 0);
const sum = (a, f) => a.reduce((s, x) => s + f(x), 0);
function totals(m){
  const bills = billsOf(m), mv = mvOf(m);
  const t = {
    inc: sum(incOf(m), i => i.amt) + sum(mv.filter(v => v.t === 'in'), v => v.amt),
    bills: sum(bills, b => b.amt),
    billsPaid: sum(bills.filter(b => isPaid(b, m)), b => b.amt),
    out: sum(mv.filter(v => v.t === 'out'), v => v.amt),
    sav: sum(depOf(m), d => d.amt),
    nb: bills.length, nbPaid: bills.filter(b => isPaid(b, m)).length
  };
  t.rest = t.inc - t.bills - t.out - t.sav;
  return t;
}
const monthlyBills = () => sum(st.bills.filter(b => !b.end || mi(b.end) >= mi(thisMonth)), b => b.amt / (b.freq || 1));

// ---------- Écrans ----------
const TABS = [['home','🏠','Accueil'],['bills','🧾','Factures'],['mv','💸','Argent'],['goals','🎯','Objectifs'],['set','⚙️','Réglages']];
function render(){
  document.getElementById('mlbl').textContent = mName(cur);
  document.getElementById('nav').innerHTML = TABS.map(t =>
    `<button class="${tab === t[0] ? 'on' : ''}" data-tab="${t[0]}"><b>${t[1]}</b>${t[2]}</button>`).join('');
  document.getElementById('main').innerHTML = ({ home, bills, mv, goals, set })[tab]();
}

function home(){
  const t = totals(cur), bl = billsOf(cur), todo = bl.filter(b => !isPaid(b, cur));
  const totSaved = sum(st.goals, goalSaved);
  const outCats = {};
  mvOf(cur).filter(v => v.t === 'out').forEach(v => outCats[v.c] = (outCats[v.c] || 0) + v.amt);
  const cats = Object.entries(outCats).sort((a, b) => b[1] - a[1]);
  const max = cats.length ? cats[0][1] : 1;
  const first = !st.bills.length && !st.inc.length && !st.mv.length && !st.goals.length;
  return `
  ${!standalone() ? `<div class="card tap" style="display:flex;gap:12px;align-items:center" onclick="showIns(1)"><span style="font-size:30px">📲</span>
    <div><b>Installez Payement</b><div class="sub mute">Touchez ici pour voir comment</div></div></div>` : ''}
  ${first ? `<div class="card"><h2>👋 Bienvenue !</h2><p class="help">Pour commencer :<br>
    1. Dans <b>💸 Argent</b>, ajoutez vos salaires (« rentrées chaque mois »).<br>
    2. Dans <b>🧾 Factures</b>, ajoutez ce que vous payez chaque mois (loyer, électricité…).<br>
    3. Dans <b>🎯 Objectifs</b>, créez votre épargne : mariage, gros achat…</p></div>` : ''}
  <div class="card big">
    <div class="lbl">Il reste pour ${esc(mName(cur))}</div>
    <div class="val ${t.rest < 0 ? 'out' : 'in'}">${eur(t.rest)}</div>
    <div class="lbl">${t.rest < 0 ? '⚠️ Plus de sorties que de rentrées' : 'après factures, dépenses et épargne'}</div>
  </div>
  <div class="grid2">
    <div class="mini"><div class="lbl">💼 Rentrées</div><div class="amt in">${eur(t.inc)}</div></div>
    <div class="mini"><div class="lbl">🧾 Factures</div><div class="amt out">${eur(t.bills)}</div></div>
    <div class="mini"><div class="lbl">💸 Dépenses</div><div class="amt out">${eur(t.out)}</div></div>
    <div class="mini"><div class="lbl">🐷 Mis de côté</div><div class="amt sav">${eur(t.sav)}</div></div>
  </div>
  <div class="btns">
    <button class="btn in" data-act="addMv" data-t="in">＋ Rentrée</button>
    <button class="btn out" data-act="addMv" data-t="out">－ Dépense</button>
  </div>
  ${t.nb ? `<div class="card"><h2>🧾 Factures payées : ${t.nbPaid} / ${t.nb}</h2>
    <div class="bar g"><i style="width:${t.nb ? t.nbPaid / t.nb * 100 : 0}%"></i></div>
    <div class="sub mute">${eur(t.billsPaid)} payé · ${eur(t.bills - t.billsPaid)} encore à payer</div>
    ${todo.slice(0, 5).map(b => billRow(b)).join('')}
    ${todo.length > 5 ? `<div class="sub mute" style="text-align:center;padding-top:6px">… et ${todo.length - 5} autres</div>` : ''}
    ${!todo.length ? '<div class="empty">✅ Tout est payé ce mois-ci !</div>' : ''}
  </div>` : ''}
  ${cats.length ? `<div class="card"><h2>💸 Où va l'argent ce mois-ci</h2>
    ${cats.map(([c, v]) => `<div class="cat"><span>${ico(CATS_OUT, c)}</span><span style="width:84px">${catName(CATS_OUT, c)}</span>
    <div class="bar"><i style="width:${v / max * 100}%"></i></div><span class="amt">${eur(v)}</span></div>`).join('')}</div>` : ''}
  ${st.goals.length ? `<div class="card tap" data-tab="goals"><h2>🐷 Total mis de côté : <span class="sav">${eur(totSaved)}</span></h2>
    ${st.goals.map(g => { const s = goalSaved(g); return `<div class="cat"><span>${g.i}</span><span style="width:84px" class="nm">${esc(g.nm)}</span>
    <div class="bar"><i style="width:${g.target ? Math.min(100, s / g.target * 100) : 0}%"></i></div><span class="amt">${eur(s)}</span></div>`; }).join('')}</div>` : ''}
  ${st.bills.length ? `<p class="help" style="text-align:center">En moyenne, vos factures coûtent <b>${eur(monthlyBills())}</b> par mois.</p>` : ''}`;
}

function billRow(b){
  const p = isPaid(b, cur);
  return `<div class="row ${p ? 'done' : ''}">
    <div class="l tap" data-act="editBill" data-id="${b.id}"><div class="ico">${ico(CATS_BILL, b.c)}</div>
      <div style="min-width:0"><div class="nm">${esc(b.nm)}</div><div class="sub">${b.day ? 'le ' + b.day : ''}${b.freq > 1 ? ' · ' + FREQ.find(f => f[0] === b.freq)[1].toLowerCase() : ''}</div></div></div>
    <div class="l"><span class="amt">${eur(b.amt)}</span><button class="chk ${p ? 'on' : ''}" data-act="pay" data-id="${b.id}" aria-label="Payée">${p ? '✓' : ''}</button></div>
  </div>`;
}

function bills(){
  const bl = billsOf(cur), t = totals(cur);
  const other = st.bills.filter(b => !due(b, cur));
  return `
  <div class="card"><h2>🧾 À payer en ${esc(mName(cur))}</h2>
    <p class="help">Cochez ✓ quand une facture est payée.</p>
    ${bl.length ? `<div class="bar g"><i style="width:${t.nbPaid / t.nb * 100}%"></i></div>
      <div class="sub mute">${t.nbPaid} / ${t.nb} payées · reste ${eur(t.bills - t.billsPaid)}</div>` : ''}
    ${bl.map(billRow).join('') || '<div class="empty">Aucune facture pour ce mois.</div>'}
    <div class="row"><b>Total</b><span class="amt out">${eur(t.bills)}</span></div>
  </div>
  <div class="btns"><button class="btn" data-act="addBill">＋ Ajouter une facture</button></div>
  ${other.length ? `<div class="card"><h2>📅 Pas ce mois-ci</h2>
    ${other.map(b => `<div class="row tap" data-act="editBill" data-id="${b.id}"><div class="l"><div class="ico">${ico(CATS_BILL, b.c)}</div>
    <div style="min-width:0"><div class="nm">${esc(b.nm)}</div><div class="sub">${nextDue(b)}</div></div></div><span class="amt mute">${eur(b.amt)}</span></div>`).join('')}</div>` : ''}

// ---------- Partage en direct entre vos téléphones (Firebase Realtime Database) ----------
// Les deux téléphones lisent et écrivent FB/familles/FAM.json. Chaque élément porte sa date de modification (u),
// les suppressions sont notées dans `gone` : la fusion garde toujours le plus récent, rien ne se perd.
const FB = 'https://celine-fcdb2-default-rtdb.europe-west1.firebasedatabase.app';
const FAM = 'pay-bkc7j-rtopc-xzd3k-kwsk4';
const famURL = () => FB + '/familles/' + FAM + '.json';
const LISTS = ['bills','inc','mv','goals','dep'];
function norm(x){
  if (x === null || x === undefined || x === '') return undefined;
  if (typeof x !== 'object') return x;
  const o = {}; Object.keys(x).sort().forEach(k => { const v = norm(x[k]); if (v !== undefined && !(typeof v === 'object' && !Object.keys(v).length)) o[k] = v; }); return o;
}
const asMap = a => { const o = {}; (a || []).forEach(x => { if (x && x.id) o[x.id] = x; }); return o; };
function pack(s){ const o = { paid: s.paid, gone: s.gone }; LISTS.forEach(k => o[k] = asMap(s[k])); return norm(o) || {}; }
function merge(a, b){
  a = a || {}; b = b || {};
  const g = { ...(a.gone || {}) }; for (const k in b.gone || {}) g[k] = Math.max(g[k] || 0, b.gone[k]);
  const old = Date.now() - 90 * 864e5; for (const k in g) if (g[k] < old) delete g[k];
  const newer = (x, y) => !x ? y : !y ? x : ((y.u || 0) > (x.u || 0) ? y : x);
  const o = { gone: g, paid: { ...(a.paid || {}) } };
  for (const k in b.paid || {}) o.paid[k] = newer(o.paid[k], b.paid[k]);
  LISTS.forEach(n => {
    const l = { ...(a[n] || {}) }; for (const k in b[n] || {}) l[k] = newer(l[k], b[n][k]);
    for (const k in l) if (g[k] !== undefined && g[k] >= (l[k].u || 0)) delete l[k];
    o[n] = l;
  });
  return norm(o) || {};
}
function unpack(m){
  const vals = o => Object.values(o || {}).sort((x, y) => x.id < y.id ? -1 : 1);
  LISTS.forEach(k => st[k] = vals(m[k]));
  st.paid = m.paid || {}; st.gone = m.gone || {};
  saveLocal();
}
let syncing = false, again = false, syncOK = '';
function setSy(t){ syncOK = t; const e = document.getElementById('sy'); if (e) e.textContent = t === 'ok' ? '☁️ partagé' : t === 'err' ? '⚠️ hors ligne' : '☁️ …'; }
async function sync(){
  if (syncing) { again = true; return; } syncing = true;
  try {
    const r = await fetch(famURL(), { cache:'no-store' }); if (!r.ok) throw r.status;
    const remote = norm(await r.json()) || {}, local = pack(st), m = merge(local, remote), ms = JSON.stringify(m);
    if (ms !== JSON.stringify(remote)) { const w = await fetch(famURL(), { method:'PUT', body: ms }); if (!w.ok) throw w.status; }
    // Ce qui a été ajouté pendant l'envoi est gardé ; le prochain envoi s'en charge.
    const now = pack(st), m2 = JSON.stringify(now) === JSON.stringify(local) ? m : merge(now, m);
    if (JSON.stringify(m2) !== JSON.stringify(now)) { unpack(m2); if (!formDone) render(); else needR = true; }
    setSy('ok');
  } catch(e) { setSy('err'); }
  syncing = false; if (again) { again = false; sync(); }
}
let needR = false;
// Écoute en direct : dès que l'autre téléphone change quelque chose, on récupère.
let es = null, esT;
function startStream(){
  if (es) es.close(); if (!window.EventSource) return;
  try { es = new EventSource(famURL()); const on = () => { clearTimeout(esT); esT = setTimeout(sync, 300); };
    es.addEventListener('put', on); es.addEventListener('patch', on); es.onerror = () => setSy('err'); } catch(e) {}
}
function sendApp(){
  const u = location.origin + location.pathname, txt = '💶 Notre appli Payement (factures, dépenses, épargne) : ' + u;
  if (navigator.share) navigator.share({ text: txt }).catch(() => {});
  else (navigator.clipboard ? navigator.clipboard.writeText(u) : Promise.reject()).then(() => toast('Lien copié 📋'), () => prompt('Copiez ce lien :', u));
}
setInterval(sync, 30000);

// ---------- Installation sur l'écran d'accueil ----------
const UA = navigator.userAgent;
const standalone = () => matchMedia('(display-mode: standalone)').matches || matchMedia('(display-mode: fullscreen)').matches || navigator.standalone === true;
const isIOS = /iphone|ipad|ipod/i.test(UA) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const isAndroid = /Android/i.test(UA);
const inApp = () => /; wv\)|FBAN|FBAV|FB_IAB|Messenger|Instagram|WhatsApp|Snapchat|TikTok|GSA\//.test(UA);
const appName = () => /WhatsApp/.test(UA) ? 'WhatsApp' : /Messenger|FBAN|FBAV|FB_IAB/.test(UA) ? 'Messenger' : /Instagram/.test(UA) ? 'Instagram' : /Snapchat/.test(UA) ? 'Snapchat' : 'une autre application';
let dp = null;
addEventListener('beforeinstallprompt', e => { e.preventDefault(); dp = e; if (document.getElementById('ins').classList.contains('on')) showIns(1); else render(); });
addEventListener('appinstalled', () => { dp = null; hideIns(); toast('Payement est installée 🎉'); render(); });
function install(){ if (!dp) return; dp.prompt(); dp.userChoice.then(c => { if (c && c.outcome === 'accepted') hideIns(); }).finally(() => { dp = null; render(); }); }
const URL0 = () => location.origin + location.pathname;
function copyLink(){ const u = URL0(); (navigator.clipboard ? navigator.clipboard.writeText(u) : Promise.reject()).then(() => toast('Lien copié ✓'), () => prompt('Copiez ce lien :', u)); }
function openSafari(){ location.href = 'x-safari-' + URL0(); setTimeout(() => toast('Si rien ne s\'ouvre : suivez les étapes'), 1500); }
function openChrome(){ const u = URL0(); location.href = 'intent://' + u.replace(/^https?:\/\//, '') + '#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url=' + encodeURIComponent(u) + ';end'; }
const stp = (n, h) => `<div class="st"><span class="num">${n}</span><div>${h}</div></div>`;
function insHTML(){
  if (inApp() && isIOS) return `<h2>Encore une petite étape 💶</h2><p>Le lien s'est ouvert dans <b>${appName()}</b>. Pour installer Payement, il faut l'ouvrir dans <b>Safari</b>.</p>
    <button class="btn" onclick="openSafari()">🧭 Ouvrir dans Safari</button>
    <p class="help" style="margin-top:14px">Si le bouton ne marche pas :</p>
    ${stp(1, 'Touchez <b>⋯</b> ou <b>⬆️</b>')}${stp(2, 'Choisissez <b>« Ouvrir dans Safari »</b> 🧭')}
    <button class="btn alt" onclick="copyLink()">📋 Copier le lien</button>`;
  if (inApp() && isAndroid) return `<h2>Encore une petite étape 💶</h2><p>Le lien s'est ouvert dans <b>${appName()}</b>. Pour installer Payement, il faut l'ouvrir dans <b>Chrome</b>.</p>
    <button class="btn" onclick="openChrome()">🌐 Ouvrir dans Chrome</button>
    ${stp(1, 'Sinon : touchez <b>⋮</b> en haut à droite')}${stp(2, 'Choisissez <b>« Ouvrir dans Chrome »</b>')}`;
  if (dp) return `<h2>Installez Payement 💶</h2><p>Elle sera sur votre écran d'accueil, comme une vraie application.</p><button class="btn" onclick="install()">📲 Installer</button>`;
  if (isIOS) return `<h2>Installez Payement 💶</h2><p>3 petites étapes et elle sera sur votre écran d'accueil :</p>
    ${stp(1, 'Touchez le bouton <b>Partager ⬆️</b> (en bas ou dans la barre d\'adresse)')}
    ${stp(2, 'Faites défiler et touchez <b>« Sur l\'écran d\'accueil »</b> ➕')}
    ${stp(3, 'Touchez <b>« Ajouter »</b> en haut à droite')}
    <p class="help">Ensuite, ouvrez Payement depuis l'icône sur votre écran.</p>`;
  if (isAndroid) return `<h2>Installez Payement 💶</h2>${stp(1, 'Touchez <b>⋮</b> en haut à droite de Chrome')}${stp(2, 'Choisissez <b>« Installer l\'application »</b> ou <b>« Ajouter à l\'écran d\'accueil »</b>')}
    <button class="btn alt" onclick="openChrome()">🌐 Pas dans le menu ? Ouvrir dans Chrome</button>`;
  return `<h2>Payement 💶</h2><p>Ouvrez ce lien sur votre téléphone pour installer Payement.</p><button class="btn alt" onclick="copyLink()">📋 Copier le lien</button>`;
}
function showIns(force){
  if (standalone()) return;
  if (!force) { try { if (Date.now() - (+localStorage.getItem('pay_ins') || 0) < 864e5) return false; } catch(e) {} }
  document.getElementById('insc').innerHTML = insHTML(); document.getElementById('ins').classList.add('on'); return true;
}
function hideIns(){ document.getElementById('ins').classList.remove('on'); if (!me()) setTimeout(whoSheet, 300); }
function insLater(){ try { localStorage.setItem('pay_ins', Date.now()); } catch(e) {} hideIns(); }

// ---------- Mises à jour : automatiques, sinon bouton « Mettre à jour » ----------
let SWR = null;
if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js?v=' + APPV).then(r => { SWR = r; }).catch(() => {});
function chkUpd(man){
  if (SWR) SWR.update().catch(() => {});
  fetch('version.json?' + Date.now(), { cache:'no-store' }).then(r => r.ok ? r.json() : null).then(j => {
    if (!j || !j.v || j.v === APPV) { if (man) toast('Payement est à jour ✓'); return; }
    // On recharge tout seul (une seule fois par version), sauf si une fenêtre de saisie est ouverte.
    let tried = ''; try { tried = localStorage.getItem('pay_auto') || ''; } catch(x) {}
    if (tried !== j.v && !formDone) {
      try { localStorage.setItem('pay_auto', j.v); } catch(x) {}
      (SWR ? SWR.update().catch(() => {}) : Promise.resolve()).then(() => location.reload()); return;
    }
    document.getElementById('updn').textContent = j.notes || ''; document.getElementById('upd').classList.add('on');
  }).catch(() => { if (man) toast('Pas de connexion'); });
}
try { const o = localStorage.getItem('pay_v'); localStorage.setItem('pay_v', APPV); if (o && o !== APPV) setTimeout(() => toast('Payement a été mise à jour ✨'), 600); } catch(e) {}
setInterval(chkUpd, 30 * 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) { chkUpd(); sync(); if (!formDone) render(); } });

render();
setSy(''); startStream(); sync(); chkUpd();
if (!showIns() && !me()) setTimeout(whoSheet, 500);
</script>
</body>
