<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Payement</title>
<meta name="theme-color" content="#f6f2f0" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#141113" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Payement">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&family=Nunito:wght@400;600;700;800&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f2f0;--card:#ffffff;--ink:#1f1a1d;--mute:#8d8489;--line:#eee7e4;--soft:#f7ecec;
  --brand:#c43d5c;--brand2:#f08a5d;--in:#16a065;--out:#e2474b;--sav:#3d72d8;--warn:#d98a00;
  --inS:#e5f6ee;--outS:#fdeaea;--savS:#e8effc;
  --shadow:0 1px 2px rgba(60,20,30,.04),0 6px 20px rgba(60,20,30,.06);
  --r:22px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#141113;--card:#1f1a1d;--ink:#f5eff2;--mute:#a69ca1;--line:#2f282b;--soft:#33232a;
  --brand:#e85a78;--brand2:#f59a6e;--in:#3cc98a;--out:#ff6b6b;--sav:#74a1f0;--warn:#f0b040;
  --inS:#183327;--outS:#3a1d1f;--savS:#1b2740;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* en-tête */
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px}
.hbar{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--brand2),var(--brand));display:grid;place-items:center;color:#fff;font-weight:800;font-size:17px;flex:none}
header h1{margin:0;font-size:19px;font-weight:800;letter-spacing:-.3px;flex:1}
.month{display:flex;align-items:center;background:var(--card);border-radius:999px;box-shadow:var(--shadow);padding:3px}
.month button{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--mute)}
.month button:active{background:var(--soft)}
.month button svg.i{width:18px;height:18px}
.month span{font-weight:700;font-size:14px;text-transform:capitalize;min-width:104px;text-align:center}
.sy{width:10px;height:10px;border-radius:50%;background:var(--mute);flex:none;font-size:0}
.sy.ok{background:var(--in);box-shadow:0 0 0 4px var(--inS)}.sy.err{background:var(--warn)}
main{max-width:640px;margin:0 auto;padding:6px 16px 16px}
/* blocs */
.card{background:var(--card);border-radius:var(--r);padding:16px 18px;margin-bottom:14px;box-shadow:var(--shadow)}
.card h2{margin:0 0 8px;font-size:16px;font-weight:700;letter-spacing:-.2px}
.sec{display:flex;align-items:center;justify-content:space-between;margin:22px 4px 10px}
.sec h3{margin:0;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--mute)}
.sec a,.sec button{font-size:14px;font-weight:700;color:var(--brand)}
h2.t{margin:18px 4px 10px;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--mute)}
.big{text-align:center;padding:22px 18px}
.big .lbl{color:var(--mute);font-size:14px}
.big .val{font-size:40px;font-weight:800;margin:2px 0;letter-spacing:-1px}
/* carte principale */
.hero{position:relative;overflow:hidden;border-radius:28px;padding:22px 20px 18px;margin:4px 0 16px;color:#fff;
  background:linear-gradient(135deg,var(--brand2) 0%,var(--brand) 70%);box-shadow:0 14px 34px color-mix(in srgb,var(--brand) 35%,transparent)}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.1)}
.hero::before{width:220px;height:220px;right:-70px;top:-90px}.hero::after{width:140px;height:140px;left:-50px;bottom:-70px}
.hero>*{position:relative}
.hero.blue{background:linear-gradient(135deg,#5b9bf0 0%,#3557c9 75%);box-shadow:0 14px 34px rgba(53,87,201,.3)}
.hero .lbl{font-size:14px;opacity:.9;font-weight:500}
.hero .val{font-size:44px;font-weight:800;letter-spacing:-1.5px;line-height:1.1;margin:4px 0 2px}
.hero .val small{font-size:24px;font-weight:700;opacity:.85;letter-spacing:-.5px}
.hero .note{font-size:13px;opacity:.85}
.hbar2{height:8px;border-radius:6px;background:rgba(255,255,255,.25);margin:16px 0 14px;overflow:hidden;display:flex}
.hbar2 i{display:block;height:100%}
.hst{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.hst div{background:rgba(255,255,255,.14);border-radius:14px;padding:9px 10px}
.hst span{display:block;font-size:11.5px;opacity:.9;font-weight:600}
.hst b{font-size:15px;font-weight:800;white-space:nowrap;letter-spacing:-.3px}
/* actions rapides */
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:6px}
.qa button{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--ink);white-space:nowrap}
.qa .c{width:56px;height:56px;border-radius:20px;display:grid;place-items:center;background:var(--card);box-shadow:var(--shadow)}
.qa .c svg.i{width:24px;height:24px}
.qa button:active .c{transform:scale(.93)}
.qa .g{color:var(--in);background:var(--inS)}.qa .r{color:var(--out);background:var(--outS)}.qa .b{color:var(--sav);background:var(--savS)}.qa .o{color:var(--brand);background:var(--soft)}
/* lignes */
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .l{display:flex;align-items:center;gap:12px;min-width:0}
.row .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.row .sub,.sub{color:var(--mute);font-size:13px}
.ico{width:42px;height:42px;border-radius:14px;background:var(--soft);display:grid;place-items:center;font-size:20px;flex:none}
.amt{font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums;letter-spacing:-.2px}
.in{color:var(--in)}.out{color:var(--out)}.sav{color:var(--sav)}.warn{color:var(--warn)}.mute{color:var(--mute)}
.tap{cursor:pointer}.tap:active{opacity:.6}
.chk{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;font-size:15px;font-weight:800;transition:.15s}
.chk.on{background:var(--in);border-color:var(--in);color:#fff}
.done .nm{text-decoration:line-through;color:var(--mute)}.done .ico{filter:grayscale(1);opacity:.6}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin:8px 0 6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--brand2),var(--brand));border-radius:6px}
.bar.g i{background:var(--in)}.bar.b i{background:var(--sav)}
/* boutons */
.btns{display:flex;gap:10px;margin-bottom:14px}
.btn{flex:1;padding:14px 12px;border-radius:16px;background:var(--brand);color:#fff;font-weight:700;font-size:15.5px}
.btn.alt{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.btn.in{background:var(--in);color:#fff}.btn.out{background:var(--out);color:#fff}
.btn.small{flex:none;padding:9px 14px;font-size:14px;border-radius:12px}
.card .btn.alt{background:var(--bg);box-shadow:none}
.btn:active{transform:scale(.97)}
.empty{text-align:center;color:var(--mute);padding:18px 6px;font-size:15px}
.card.empty{padding:26px 18px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.mini{background:var(--card);border-radius:18px;padding:13px 14px;box-shadow:var(--shadow)}
.mini .lbl{font-size:13px;color:var(--mute)}.mini .amt{font-size:19px}
/* démarrage */
.steps .row{gap:12px}
.stepn{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;flex:none;background:var(--soft);color:var(--brand)}
.stepn.ok{background:var(--in);color:#fff}
/* barre du bas */
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;max-width:120px;padding:4px 2px;font-size:11px;font-weight:600;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:3px}
nav button .p{width:52px;height:30px;border-radius:15px;display:grid;place-items:center;transition:.2s}
nav button.on{color:var(--brand)}
nav button.on .p{background:var(--soft)}
/* fenêtre */
#modal{position:fixed;inset:0;z-index:10;background:rgba(20,10,15,.45);display:none;align-items:flex-end;justify-content:center}
#modal.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:640px;border-radius:26px 26px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom));
  max-height:92vh;overflow:auto;animation:up .22s ease-out}
.sheet::before{content:"";display:block;width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet h3{margin:0 0 16px;font-size:20px;font-weight:800;letter-spacing:-.3px}
.f{margin-bottom:14px}
.f label{display:block;font-size:13px;font-weight:600;color:var(--mute);margin-bottom:6px}
.f input,.f select{width:100%;padding:13px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:17px;outline:none}
.f input:focus,.f select:focus{border-color:var(--brand)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{padding:8px 13px;border-radius:999px;background:var(--bg);border:1.5px solid var(--line);font-size:14px;font-weight:600}
.chips button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.sheet .btns{margin:18px 0 0}
.del{color:var(--out);width:100%;padding:12px;margin-top:8px;font-weight:700}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(10px);background:#1f1a1d;color:#fff;
  padding:11px 18px;border-radius:999px;font-size:14px;font-weight:600;z-index:50;opacity:0;transition:.25s;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%)}
textarea{width:100%;min-height:90px;padding:10px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:13px monospace}
.cat{display:flex;align-items:center;gap:10px;margin:9px 0;font-size:14px}
.cat .bar{flex:1;margin:0;height:8px}
.cat .amt{min-width:84px;text-align:right;font-size:14px}
p.help{color:var(--mute);font-size:14px;margin:2px 0 10px}
/* mise à jour, installation, espace, verrou */
#upd{position:fixed;left:12px;right:12px;bottom:calc(92px + env(safe-area-inset-bottom));z-index:9;display:none;gap:10px;align-items:center;background:var(--ink);color:var(--bg);
  padding:14px 14px 14px 16px;border-radius:20px;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:620px;margin:0 auto}
#upd.on{display:flex}#upd>div{flex:1;line-height:1.3}#upd small{display:block;opacity:.8;font-size:13px}
#upd button{background:var(--brand);color:#fff;font-weight:800;border-radius:12px;padding:10px 14px;white-space:nowrap}
#ins,#sp{position:fixed;inset:0;z-index:30;background:var(--bg);display:none;flex-direction:column;justify-content:center;
  padding:calc(24px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom));overflow:auto}
#sp{z-index:25}
#ins.on,#sp.on{display:flex}#insc,#spc{max-width:460px;margin:0 auto;width:100%}
#ins h2,#sp h2{font-size:27px;font-weight:800;letter-spacing:-.5px;margin:0 0 10px}#ins p,#sp p{font-size:16px;margin:0 0 16px}
#ins .btn,#sp .btn{display:block;width:100%;font-size:17px;padding:16px;margin:8px 0}
#ins .st,#sp .st{display:flex;gap:14px;align-items:center;background:var(--card);border-radius:18px;padding:14px;margin:10px 0;box-shadow:var(--shadow);font-size:16px}
#ins .st .num,#sp .st .num{font-weight:800;flex:none;width:34px;height:34px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center}
#ins .later,#lock .later{margin:18px auto 0;color:var(--mute);font-weight:700;padding:10px;display:block}
#ins .arrow{text-align:center;font-size:40px}
.codein{width:100%;padding:15px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:17px monospace;margin-top:4px}
#lock{position:fixed;inset:0;z-index:40;background:linear-gradient(160deg,var(--brand2),var(--brand) 65%);color:#fff;display:none;align-items:center;justify-content:center;
  padding:calc(20px + env(safe-area-inset-top)) 20px calc(20px + env(safe-area-inset-bottom))}
#lock.on{display:flex}
.lk{width:100%;max-width:340px;text-align:center}
.lkico{width:64px;height:64px;border-radius:22px;background:rgba(255,255,255,.2);display:grid;place-items:center;margin:0 auto;font-size:30px;font-weight:800}
.lk h2{font-size:20px;font-weight:700;margin:16px 0 20px}
.dots{display:flex;justify-content:center;gap:18px;margin-bottom:30px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid #fff;transition:.15s}.dots i.on{background:#fff;transform:scale(1.1)}
.dots.bad{animation:sh .35s}@keyframes sh{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;justify-items:center}
.pad button{width:74px;height:74px;border-radius:50%;background:rgba(255,255,255,.16);color:#fff;font-size:28px;font-weight:600}
.pad button:active{background:rgba(255,255,255,.4)}
#lock .later{color:#fff;opacity:.85}

/* ===== 20/11 : badges, annuler, calculatrice, synchro, bilan ===== */
.sy{position:relative;cursor:pointer}.sy::after{content:"";position:absolute;inset:-14px}
.bdg{display:inline-block;font-size:11.5px;font-weight:700;padding:1px 8px;border-radius:999px;margin-left:4px;vertical-align:1px;white-space:nowrap}
.bdg.late{background:var(--outS);color:var(--out)}.bdg.soon{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.bdg.auto{background:var(--savS);color:var(--sav)}.bdg.ok{background:var(--inS);color:var(--in)}
.chk.pop{animation:pop .3s ease-out}@keyframes pop{50%{transform:scale(1.25)}}
.fx .bar i,.fx .hbar2 i{animation:grow .6s ease-out}@keyframes grow{from{width:0}}
#undo{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(10px);background:#1f1a1d;color:#fff;z-index:51;
  display:flex;align-items:center;gap:14px;padding:8px 8px 8px 18px;border-radius:999px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;max-width:92vw;white-space:nowrap}
#undo.on{opacity:1;pointer-events:auto;transform:translateX(-50%)}
#undo button{background:#fff;color:#1f1a1d;font-weight:800;border-radius:999px;padding:7px 14px}
[data-theme=c] #undo{background:#1d1a16;color:#f0dfb8}[data-theme=c] #undo button{background:#c9a45c}
.ops{display:flex;gap:6px;margin-top:6px}.ops button{flex:1;padding:7px 0;border-radius:10px;background:var(--bg);border:1.5px solid var(--line);font-weight:800;font-size:17px;color:var(--mute)}
.calc{font-size:13px;color:var(--brand);font-weight:700;margin-top:5px;min-height:0}
.hint{font-size:13px;margin-top:5px;font-weight:600}.hint.bad{color:var(--out)}.hint.good{color:var(--in)}
.srch{width:100%;padding:11px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:15px;outline:none;margin-bottom:10px}
.chips.sm button{padding:6px 11px;font-size:13px}
.note2{font-style:italic}
.qr{display:grid;place-items:center;background:#fff;border-radius:16px;padding:12px;margin:6px auto 10px;max-width:260px}.qr svg,.qr img{width:100%;height:auto;display:block}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{fill:var(--mute);font-size:10px;font-family:inherit}
.chart .tip{font-weight:700;fill:var(--ink);font-size:11px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--mute);margin-top:8px}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.back{display:flex;align-items:center;gap:4px;font-weight:700;color:var(--brand);padding:6px 0;margin-top:4px}

/* ===== Styles au choix (propres à chaque téléphone : html[data-theme]) ===== */
.tiles,.donut{display:none}
/* A : Nuit violette */
html[data-theme=a]{--bg:#0c0a17;--card:rgba(255,255,255,.055);--ink:#f3f0ff;--mute:#9a92bf;--line:rgba(255,255,255,.09);--soft:rgba(167,139,250,.16);
  --brand:#c06cf0;--brand2:#f472b6;--in:#34d399;--out:#fb7185;--sav:#a78bfa;--warn:#fbbf24;--inS:rgba(16,185,129,.18);--outS:rgba(244,63,94,.18);--savS:rgba(139,92,246,.22);--shadow:none;color-scheme:dark}
html[data-theme=a],html[data-theme=a] body{background:#0c0a17}
html[data-theme=a] body{background:radial-gradient(120% 50% at 85% -5%,#3b1d6e,transparent 60%),radial-gradient(80% 40% at -10% 30%,#4a1640,transparent 60%),#0c0a17;background-attachment:fixed;font-family:Outfit,system-ui,sans-serif;padding-bottom:calc(104px + env(safe-area-inset-bottom))}
[data-theme=a] header{background:rgba(12,10,23,.7)}
[data-theme=a] .card,[data-theme=a] .mini{border:1px solid var(--line)}
[data-theme=a] .month{border:1px solid var(--line)}
[data-theme=a] .hero{background:linear-gradient(145deg,rgba(255,255,255,.13),rgba(255,255,255,.03));border:1px solid rgba(255,255,255,.14);box-shadow:0 20px 50px rgba(139,92,246,.28)}
[data-theme=a] .hero::before,[data-theme=a] .hero::after{display:none}
[data-theme=a] .hero .lbl{color:#c4b5fd}
[data-theme=a] .hero .val{font-size:38px;background:linear-gradient(90deg,#fff,#f0abfc);-webkit-background-clip:text;background-clip:text;color:transparent}
[data-theme=a] .hero.home .val,[data-theme=a] .hero.home .note{padding-right:96px}
[data-theme=a] .hero .note{color:#a39bc4}
[data-theme=a] .donut{display:block;position:absolute;right:18px;top:20px;width:88px;height:88px}
[data-theme=a] .hero.home .hbar2{display:none}[data-theme=a] .hst{margin-top:16px}
[data-theme=a] .hst div{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08)}
[data-theme=a] .hst div:nth-child(1) b{color:#6ee7b7}[data-theme=a] .hst div:nth-child(2) b{color:#fda4af}[data-theme=a] .hst div:nth-child(3) b{color:#c4b5fd}
[data-theme=a] .qa .c{border:0;color:#fff}
[data-theme=a] .qa .g{background:linear-gradient(135deg,#10b981,#059669)}[data-theme=a] .qa .r{background:linear-gradient(135deg,#f43f5e,#be123c)}
[data-theme=a] .qa .b{background:linear-gradient(135deg,#8b5cf6,#6d28d9)}[data-theme=a] .qa .o{background:linear-gradient(135deg,#f59e0b,#ea580c)}
[data-theme=a] .sec button,[data-theme=a] .sec a{color:#f0abfc}
[data-theme=a] nav{left:14px;right:14px;bottom:calc(12px + env(safe-area-inset-bottom));padding:6px;border-radius:24px;border:1px solid var(--line);background:rgba(25,20,45,.88)}
[data-theme=a] nav button.on{color:#f0abfc}
[data-theme=a] .sheet{background:#1a1630}

<script>
'use strict';
const APPV = '2026-11-20.1';
const KEY = 'pay_save';

// ---------- Catégories ----------
const CATS_OUT = [['courses','🛒','Courses'],['maison','🏠','Maison'],['voiture','🚗','Voiture'],['enfants','🧸','Enfants'],
  ['sante','💊','Santé'],['loisirs','🎉','Loisirs'],['resto','🍔','Resto'],['vetements','👕','Vêtements'],['cadeaux','🎁','Cadeaux'],['autre','📦','Autre']];
const CATS_IN = [['salaire','💼','Salaire'],['aide','👶','Allocations'],['vente','🏷️','Vente'],['cadeau','🎁','Cadeau'],['autre','💰','Autre']];
const CATS_BILL = [['loyer','🏠','Loyer / prêt'],['energie','⚡','Gaz / électricité'],['eau','💧','Eau'],['internet','📶','Internet / GSM'],
  ['assurance','🛡️','Assurance'],['voiture','🚗','Voiture'],['abonnement','📺','Abonnement'],['credit','🏦','Crédit'],['creche','🧸','Crèche / école'],['autre','🧾','Autre']];
const QUICK = [['Loyer','loyer'],['Prêt maison','credit'],['Électricité','energie'],['Gaz','energie'],['Eau','eau'],['Internet','internet'],['GSM','internet'],
  ['Assurance auto','assurance'],['Assurance habitation','assurance'],['Mutuelle','assurance'],['Taxe voiture','voiture'],['Netflix','abonnement'],['Spotify','abonnement'],['Crèche','creche'],['Prêt voiture','credit']];
const QUICK_OUT = [['Courses','courses'],['Essence','voiture'],['Pharmacie','sante'],['Resto','resto'],['Boulangerie','courses'],['Vêtements','vetements'],['Sortie','loisirs'],['Cadeau','cadeaux']];
const GOAL_ICO =['💍','🏡','🚗','✈️','👶','🛋️','🎄','🐷','🎓','💻'];
const FREQ = [[1,'Chaque mois 🔁'],[0,'Une seule fois (ce mois-là)'],[2,'Tous les 2 mois'],[3,'Tous les 3 mois'],[6,'Tous les 6 mois'],[12,'Une fois par an']];
const ico = (list, k) => (list.find(c => c[0] === k) || list[list.length - 1])[1];
const catName = (list, k) => (list.find(c => c[0] === k) || list[list.length - 1])[2];

// ---------- Sauvegarde ----------
// `cfg` (20/11) : réglages communs du budget {id, v, u} — budgets par catégorie (`bud_<cat>`), report du reste (`carry` = mois de départ).
function blank(){ return { sv:2, bills:[], paid:{}, inc:[], mv:[], goals:[], dep:[], acc:[], prof:[], cfg:[], gone:{} }; }
function load(){
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.sv) return upg(Object.assign(blank(), s)); } catch(e) {}
  return blank();
}
// Ancienne version (sv 1) : factures payées rangées par mois en liste -> carte "mois_id" = {v,u}.
function upg(s){
  if (s.sv < 2) {
    const p = {}, n = Date.now();
    for (const m in s.paid) if (Array.isArray(s.paid[m])) s.paid[m].forEach(id => p[m + '_' + id] = { v: true, u: n });
    s.paid = p; ['bills','inc','mv','goals','dep'].forEach(k => s[k].forEach(x => x.u = x.u || n)); s.sv = 2;
  }
  return s;
}
let st = load();
function saveLocal(){ try { localStorage.setItem(KEY, JSON.stringify(st)); } catch(e) { toast('⚠️ Impossible d\'enregistrer'); } }
let pushT;
function save(){ saveLocal(); clearTimeout(pushT); pushT = setTimeout(sync, 500); }
const gone = id => { st.gone[id] = Date.now(); };
const touch = x => { x.u = Date.now(); return x; };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

// ---------- Dates & montants ----------
const pad = n => String(n).padStart(2, '0');
const now = new Date();
const thisMonth = now.getFullYear() + '-' + pad(now.getMonth() + 1);
const today = thisMonth + '-' + pad(now.getDate());
let cur = thisMonth, tab = 'home';
const mi = m => { const [y, mo] = m.split('-').map(Number); return y * 12 + mo - 1; };
const fromMi = i => Math.floor(i / 12) + '-' + pad(i % 12 + 1);
const mName = m => new Date(+m.slice(0, 4), +m.slice(5, 7) - 1, 1).toLocaleDateString('fr-BE', { month:'long', year:'numeric' });
const EUR = new Intl.NumberFormat('fr-BE', { style:'currency', currency:'EUR' });
const eur = n => EUR.format(Math.round(n * 100) / 100);
// Montant tapé : accepte 45,20 · 45.20 · 1.234,56 · 1 234,56 et les calculs (45,20+12,80 · 3x15 · 100/4).
function numTok(t){
  if (t.includes(',') && t.includes('.')) t = t.replace(/\./g, '').replace(',', '.');
  else if (t.includes(',')) { if (t.split(',').length > 2) return NaN; t = t.replace(',', '.'); }
  else if ((t.match(/\./g) || []).length > 1) t = t.replace(/\./g, '');
  else if (/^[1-9]\d{0,2}\.\d{3}$/.test(t)) t = t.replace('.', '');
  return /^\d*\.?\d*$/.test(t) && /\d/.test(t) ? parseFloat(t) : NaN;
}
function calc(s){
  s = String(s ?? '').replace(/[\s  €]/g, '').replace(/[×xX*]/g, '*').replace(/[÷:]/g, '/').replace(/[−–]/g, '-');
  if (!s) return NaN;
  const tk = s.match(/\d[\d.,]*|[.,]\d+|[-+*/()]/g); if (!tk || tk.join('') !== s) return NaN;
  let i = 0;
  const fac = () => { const t = tk[i++]; if (t === '-') return -fac(); if (t === '+') return fac(); if (t === '(') { const v = expr(); if (tk[i++] !== ')') return NaN; return v; } return t ? numTok(t) : NaN; };
  const term = () => { let v = fac(); while (tk[i] === '*' || tk[i] === '/') { const o = tk[i++], w = fac(); v = o === '*' ? v * w : v / w; } return v; };
  const expr = () => { let v = term(); while (tk[i] === '+' || tk[i] === '-') { const o = tk[i++], w = term(); v = o === '+' ? v + w : v - w; } return v; };
  const v = expr(); return i === tk.length ? v : NaN;
}
const num = s => { const v = typeof s === 'number' ? s : calc(s); return isFinite(v) ? Math.round(v * 100) / 100 : NaN; };
const hasOp = s => /\d\s*[-+*/×xX÷:]\s*[\d(]/.test(String(s || ''));
const amtTxt = n => n.toFixed(2).replace('.', ',');
const buzz = (n = 10) => { try { if (navigator.vibrate) navigator.vibrate(n); } catch(e) {} };
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const dShort = d => new Date(d + 'T12:00').toLocaleDateString('fr-BE', { day:'numeric', month:'short' });

// ---------- Calculs ----------
function due(b, m){
  const d = mi(m) - mi(b.start);
  if (d < 0) return false;
  if (b.end && mi(m) > mi(b.end)) return false;
  if (b.freq === 0) return d === 0;
  return d % (b.freq || 1) === 0;
}
const billsOf = m => st.bills.filter(b => due(b, m)).sort((a, b) => (a.day || 0) - (b.day || 0));
const isPaid = (b, m) => !!(st.paid[m + '_' + b.id] || {}).v;
// Montant d'une facture pour un mois : `ov[mois]` = montant différent juste ce mois-là (ex : facture plus chère).
const amtOf = (b, m) => b.ov && b.ov[m] != null && isFinite(b.ov[m]) ? +b.ov[m] : b.amt;
// Échéance : nombre de jours avant (négatif = en retard). null = pas de date connue.
const today0 = new Date(now.getFullYear(), now.getMonth(), now.getDate());
const dim = m => new Date(+m.slice(0, 4), +m.slice(5, 7), 0).getDate();
function daysTo(b, m){
  if (!b.day && mi(m) >= mi(thisMonth)) return null;
  const d = new Date(+m.slice(0, 4), +m.slice(5, 7) - 1, Math.min(b.day || 31, dim(m)));
  return Math.round((d - today0) / 864e5);
}
function dueBadge(b, m){
  if (isPaid(b, m)) return b.auto ? '<span class="bdg auto">Auto</span>' : '';
  const n = daysTo(b, m);
  const a = b.auto ? '<span class="bdg auto">Auto</span>' : '';
  if (n == null || n > 7) return a;
  if (n < 0) return a + (b.auto ? '<span class="bdg soon">Prélevée ? à cocher</span>' : `<span class="bdg late">En retard${n > -60 ? ' · ' + (-n) + ' j' : ''}</span>`);
  return a + `<span class="bdg soon">${n === 0 ? 'Aujourd\'hui' : n === 1 ? 'Demain' : 'Dans ' + n + ' jours'}</span>`;
}
// À payer d'abord (par jour), puis celles déjà payées.
const sortBills = (l, m) => l.slice().sort((a, b) => (isPaid(a, m) - isPaid(b, m)) || ((a.day || 99) - (b.day || 99)));
const autoDue = m => billsOf(m).filter(b => b.auto && !isPaid(b, m) && (daysTo(b, m) ?? 1) < 0);
// Réglages communs (partagés avec l'autre téléphone)
const cfgGet = id => { const c = byId(st.cfg, id); return c ? c.v : ''; };
function cfgSet(id, v){ let c = byId(st.cfg, id); if (!c) { c = { id }; st.cfg.push(c); } c.v = v; touch(c); }
const budOf = c => +cfgGet('bud_' + c) || 0;
const incAll = m => st.inc.filter(i => mi(m) >= mi(i.start) && !(i.end && mi(m) > mi(i.end)));
// Une rentrée avec `rep` (ex : fiche de paye) remplace ce mois-là le salaire habituel `rep`.
const replOf = m => new Set(st.mv.filter(v => v.rep && v.d.slice(0, 7) === m).map(v => v.rep));
const incOf = m => { const r = replOf(m); return incAll(m).filter(i => !r.has(i.id)); };
const mvOf = m => st.mv.filter(v => v.d.slice(0, 7) === m).sort((a, b) => b.d.localeCompare(a.d));
const depOf = m => st.dep.filter(v => v.d.slice(0, 7) === m);
const goalSaved = g => st.dep.filter(d => d.g === g.id).reduce((s, d) => s + d.amt, 0);
// Compte épargne : solde de départ + versements/retraits (dep.acc) ; `adj` = correction d'après la banque (intérêts…), pas compté comme « mis de côté ».
const accBal = a => (a.init || 0) + st.dep.filter(d => d.acc === a.id).reduce((s, d) => s + d.amt, 0);
const totSav = () => sum(st.acc, accBal) + sum(st.dep.filter(d => d.g && !d.acc), d => d.amt);
const sum = (a, f) => a.reduce((s, x) => s + f(x), 0);
function baseTotals(m){
  const bills = billsOf(m), mv = mvOf(m);
  const t = {
    inc: sum(incOf(m), i => i.amt) + sum(mv.filter(v => v.t === 'in'), v => v.amt),
    bills: sum(bills, b => amtOf(b, m)),
    billsPaid: sum(bills.filter(b => isPaid(b, m)), b => amtOf(b, m)),
    out: sum(mv.filter(v => v.t === 'out'), v => v.amt),
    sav: sum(depOf(m).filter(d => !d.adj), d => d.amt),
    nb: bills.length, nbPaid: bills.filter(b => isPaid(b, m)).length
  };
  t.rest = t.inc - t.bills - t.out - t.sav;
  return t;
}
// Report du reste (réglage `carry` = premier mois reporté) : ce qui reste des mois précédents s'ajoute au mois affiché.
function carryOf(m){
  const s = cfgGet('carry'); if (!s || !/^\d{4}-\d\d$/.test(s)) return 0;
  let c = 0; for (let i = Math.max(mi(s), mi(m) - 36); i < mi(m); i++) c += baseTotals(fromMi(i)).rest;
  return Math.round(c * 100) / 100;
}
function totals(m){ const t = baseTotals(m); t.carry = carryOf(m); t.rest += t.carry; return t; }
const monthlyBills = () => sum(st.bills.filter(b => b.freq !== 0 && (!b.end || mi(b.end) >= mi(thisMonth))), b => b.amt / (b.freq || 1));

// ---------- Écrans ----------
const TABS = [['home','home','Accueil'],['bills','bill','Factures'],['mv','wallet','Argent'],['goals','coins','Épargne'],['set','sliders','Réglages']];
const ICONS = {
  home:'M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z',
  bill:'M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6M9 16h3',

function donut(t){
  const base = Math.max(t.inc, t.bills + t.out + t.sav, 1), C = 100;
  const parts = [[t.bills, '#f472b6'], [t.out, '#a78bfa'], [t.sav, '#34d399']];
  let off = 25, arcs = '';
  parts.forEach(([v, c]) => { const l = v / base * C; if (l > 0.5) arcs += `<circle cx="21" cy="21" r="15.9" fill="none" stroke="${c}" stroke-width="5" stroke-dasharray="${l} ${C - l}" stroke-dashoffset="${off}"/>`; off -= l; });
  const pc = t.inc ? Math.round((t.bills + t.out + t.sav) / t.inc * 100) : 0;
  return `<svg class="donut" viewBox="0 0 42 42"><circle cx="21" cy="21" r="15.9" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="5"/>${arcs}
    <text x="21" y="22" text-anchor="middle" fill="#fff" font-size="7.5" font-weight="700">${pc}%</text><text x="21" y="28" text-anchor="middle" fill="#a39bc4" font-size="3.6">utilisé</text></svg>`;
}

// Rythme : moyenne mise de côté par mois pour cet objectif sur les 3 derniers mois (ce mois-ci compris).
const goalPace = g => sum(st.dep.filter(d => d.g === g.id && d.d.slice(0, 7) >= fromMi(mi(thisMonth) - 2) && d.d.slice(0, 7) <= thisMonth), d => d.amt) / 3;
function goalProj(g, s){
  const left = g.target - s, mon = g.when ? mi(g.when) - mi(thisMonth) : 0, pace = goalPace(g);
  if (left <= 0) return '';
  const out = [];
  if (g.when) out.push(mon > 0 ? `Pour ${esc(mName(g.when))} : <b>${eur(left / mon)}</b> par mois` : `La date prévue (${esc(mName(g.when))}) est passée`);
  if (pace > 0) {
    const n = Math.ceil(left / pace), end = mi(thisMonth) + n;
    out.push(`Au rythme actuel (≈ ${eur(pace)} / mois) : atteint vers <b>${esc(mName(fromMi(end)))}</b>${g.when && mon > 0 ? (end <= mi(g.when) ? ' · dans les temps ✓' : ' · un peu en retard') : ''}`);
  } else out.push('Mettez de côté régulièrement : l\'appli calculera quand l\'objectif sera atteint.');
  return out.map(x => `<div class="sub" style="margin-top:4px">${x}</div>`).join('');
}

function firstMonth(){

}
const mShort = m => new Date(+m.slice(0, 4), +m.slice(5, 7) - 1, 1).toLocaleDateString('fr-BE', { month:'short' }).replace('.', '');
// Saisie d'un bâton / d'un point : affiche la valeur sous le graphique.
function chartTip(el){ const box = el.closest('.card').querySelector('.ctip'); if (box) box.innerHTML = el.dataset.tip; }
function barChart(months, vals){
  const W = 320, H = 150, top = 12, bot = 22, n = months.length, bw = W / n;
  const mx = Math.max(1, ...vals.map(Math.abs)), hasNeg = vals.some(v => v < 0);
  const y0 = hasNeg ? top + (H - top - bot) * (Math.max(0, ...vals) / (Math.max(0, ...vals) - Math.min(0, ...vals) || 1)) : H - bot;
  const sc = hasNeg ? (H - top - bot) / ((Math.max(0, ...vals) - Math.min(0, ...vals)) || 1) : (H - top - bot) / mx;
  let g = `<line x1="0" x2="${W}" y1="${y0}" y2="${y0}" stroke="var(--line)" stroke-width="1"/>`;
  months.forEach((m, i) => {
    const v = vals[i], h = Math.max(Math.abs(v) * sc, v ? 2 : 0), w = Math.min(bw * 0.6, 26), x = i * bw + (bw - w) / 2, y = v >= 0 ? y0 - h : y0;
    const tip = `${esc(mName(m))} : <b>${v >= 0 ? '+' : '−'}${eur(Math.abs(v))}</b>`;
    g += `<g class="tap" onclick="chartTip(this)" data-tip="${esc(tip)}"><rect x="${i * bw}" y="0" width="${bw}" height="${H}" fill="transparent"/>
      <rect x="${x}" y="${y}" width="${w}" height="${h}" rx="3" fill="${v >= 0 ? 'var(--in)' : 'var(--out)'}"/></g>
      <text x="${i * bw + bw / 2}" y="${H - 6}" text-anchor="middle"${m === cur ? ' style="font-weight:800;fill:var(--ink)"' : ''}>${mShort(m)}</text>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Reste de chaque mois">${g}</svg>`;
}
function lineChart(months, vals){
  const W = 320, H = 150, top = 14, bot = 22, l = 4, r = 4, n = months.length;
  const mn = Math.min(0, ...vals), mx = Math.max(1, ...vals), sc = (H - top - bot) / (mx - mn || 1);
  const X = i => n === 1 ? W / 2 : l + i * (W - l - r) / (n - 1), Y = v => H - bot - (v - mn) * sc;
  const pts = vals.map((v, i) => `${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' ');
  let g = `<line x1="0" x2="${W}" y1="${Y(mn)}" y2="${Y(mn)}" stroke="var(--line)"/>
    <polygon points="${X(0)},${Y(mn)} ${pts} ${X(n - 1)},${Y(mn)}" fill="var(--sav)" opacity=".12"/>
    <polyline points="${pts}" fill="none" stroke="var(--sav)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  months.forEach((m, i) => {
    const tip = `${esc(mName(m))} : <b>${eur(vals[i])}</b>`;
    g += `<g class="tap" onclick="chartTip(this)" data-tip="${esc(tip)}"><rect x="${X(i) - W / n / 2}" y="0" width="${W / n}" height="${H}" fill="transparent"/>
      <circle cx="${X(i)}" cy="${Y(vals[i])}" r="${i === n - 1 ? 4 : 2.5}" fill="var(--sav)" stroke="var(--card)" stroke-width="2"/></g>
      ${n <= 12 && (i % (n > 8 ? 2 : 1) === 0 || i === n - 1) ? `<text x="${X(i)}" y="${H - 6}" text-anchor="middle">${mShort(m)}</text>` : ''}`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Épargne totale">${g}</svg>`;
}
// Épargne totale à la fin d'un mois (soldes de départ des comptes + versements jusqu'à ce mois)
const savAt = m => sum(st.acc, a => a.init || 0) + sum(st.dep.filter(d => (d.acc || d.g) && d.d.slice(0, 7) <= m && (d.acc ? byId(st.acc, d.acc) : true)), d => d.amt);
function stats(){

  const rests = months.map(m => Math.round(baseTotals(m).rest * 100) / 100), savs = months.map(savAt);
  // Répartition du mois : factures (par type) + dépenses (par catégorie)
  const parts = {};
  billsOf(cur).forEach(b => { const k = 'b_' + b.c; parts[k] = parts[k] || { n: catName(CATS_BILL, b.c), i: ico(CATS_BILL, b.c), v: 0, t: 'Facture' }; parts[k].v += amtOf(b, cur); });
  mvOf(cur).filter(v => v.t === 'out').forEach(v => { const k = 'o_' + v.c; parts[k] = parts[k] || { n: catName(CATS_OUT, v.c), i: ico(CATS_OUT, v.c), v: 0, t: 'Dépense' }; parts[k].v += v.amt; });
  const pl = Object.values(parts).sort((a, b) => b.v - a.v), tot = sum(pl, p => p.v), pmax = pl.length ? pl[0].v : 1;
  const avg = rests.length ? sum(rests, x => x) / rests.length : 0;

  <div class="sec"><h3>Où part l'argent ce mois-ci</h3></div>
  <div class="card">${pl.length ? pl.map(p => `<div class="cat"><span class="ico" style="width:34px;height:34px;font-size:16px;border-radius:11px">${p.i}</span>
      <div style="flex:1;min-width:0"><div style="display:flex;justify-content:space-between;gap:8px"><span class="nm" style="font-size:14px">${esc(p.n)} <span class="sub">· ${p.t.toLowerCase()}</span></span><span class="amt" style="font-size:14px;min-width:0">${eur(p.v)}</span></div>
      <div class="bar" style="margin:4px 0 0"><i style="width:${p.v / pmax * 100}%"></i></div></div><span class="sub" style="width:36px;text-align:right">${tot ? Math.round(p.v / tot * 100) : 0} %</span></div>`).join('')
    : '<div class="empty">Pas encore de factures ni de dépenses ce mois-ci.</div>'}</div>
  <div class="sec"><h3>Reste de chaque mois</h3></div>
  <div class="card">${barChart(months, rests)}
    <div class="legend"><span><i style="background:var(--in)"></i>il est resté de l'argent</span><span><i style="background:var(--out)"></i>plus de sorties que de rentrées</span></div>
    <div class="sub ctip" style="margin-top:6px">Touchez un mois pour voir le montant.</div></div>
  <div class="sec"><h3>Notre épargne totale</h3></div>
  <div class="card">${st.acc.length || st.dep.length ? lineChart(months, savs) + '<div class="sub ctip" style="margin-top:6px">Touchez un mois pour voir le montant.</div>' : '<div class="empty">Ajoutez un compte épargne ou un objectif pour voir la courbe.</div>'}</div>
  <div class="card"><h2>Mois par mois</h2>

}

function form(title, fields, vals, onOk, onDel){
  const h = fields.map(f => {
    const v = vals[f.k] ?? '';
    if (f.t === 'chips') return `<div class="f"><label>${f.l}</label><div class="chips" data-k="${f.k}">${f.o.map(o =>
      `<button type="button" data-v="${esc(o[0])}" class="${String(o[0]) === String(v) ? 'on' : ''}">${o[1]} ${o[2] || ''}</button>`).join('')}</div></div>`;
    if (f.t === 'sel') return `<div class="f"><label>${f.l}</label><select data-k="${f.k}">${f.o.map(o =>
      `<option value="${o[0]}" ${String(o[0]) === String(v) ? 'selected' : ''}>${o[1]}</option>`).join('')}</select></div>`;
    const type = f.t === 'num' ? 'text" inputmode="decimal" data-num="1' : (f.t || 'text');
    // Montant : petite calculatrice (+ − × ÷ =) sous le champ, le résultat s'affiche en direct.
    const ops = f.t === 'num' && f.ops !== false ? `<div class="ops">${['+', '−', '×', '÷', '='].map(o => `<button type="button" data-act="op" data-v="${o}" aria-label="${o}">${o}</button>`).join('')}</div><div class="calc"></div>` : '';
    return `<div class="f"><label>${f.l}</label><input data-k="${f.k}" type="${type}" value="${esc(f.t === 'num' && v !== '' ? (typeof v === 'number' ? v.toFixed(2) : String(v)).replace('.', ',') : v)}" placeholder="${f.p || ''}" autocomplete="off">${ops}${VALID[f.k] ? '<div class="hint"></div>' : ''}</div>`;
  }).join('');
  document.getElementById('sheet').innerHTML = `<h3>${title}</h3>${h}
    <div class="btns"><button class="btn alt" data-act="close">Annuler</button><button class="btn" data-act="ok">Enregistrer</button></div>
    ${onDel ? '<button class="del" data-act="delete">🗑️ Supprimer</button>' : ''}`;
  formDone = { fields, onOk, onDel };
  document.getElementById('modal').classList.add('on');
  document.querySelectorAll('#sheet input[data-k]').forEach(chkField);
  const first = document.querySelector('#sheet input');
  if (first && !vals[first.dataset.k]) setTimeout(() => first.focus(), 150);
}
// Vérification bancaire (modulo 97) de l'IBAN et de la communication structurée belge.
function ibanOK(s){
  const t = String(s || '').replace(/\s/g, '').toUpperCase();
  if (!/^[A-Z]{2}\d{2}[A-Z0-9]{10,30}$/.test(t) || (t.startsWith('BE') && t.length !== 16)) return false;
  let r = 0; for (const ch of t.slice(4) + t.slice(0, 4)) { const d = /\d/.test(ch) ? ch : String(ch.charCodeAt(0) - 55); for (const x of d) r = (r * 10 + +x) % 97; }
  return r === 1;
}
function comOK(s){
  const d = String(s || '').replace(/\D/g, ''); if (d.length !== 12) return false;
  return (+d.slice(0, 10) % 97 || 97) === +d.slice(10);
}
const fmtCom = s => { const d = String(s || '').replace(/\D/g, ''); return d.length === 12 ? `+++${d.slice(0, 3)}/${d.slice(3, 7)}/${d.slice(7)}+++` : s; };
const fmtIban = s => String(s || '').toUpperCase().replace(/\s/g, '').replace(/(.{4})/g, '$1 ').trim();
const VALID = {
  iban: v => !v ? '' : ibanOK(v) ? ['good', '✓ Numéro de compte valable'] : ['bad', '⚠️ Ce numéro de compte n\'est pas valable : vérifiez-le'],
  com: v => !v ? '' : comOK(v) ? ['good', '✓ Communication valable'] : /^\s*[+*]{3}|^\s*\d{3}\s*\/\s*\d{4}/.test(v) || v.replace(/\D/g, '').length === 12 ? ['bad', '⚠️ Cette communication n\'est pas valable : vérifiez les chiffres'] : ''
};
function chkField(inp){
  const f = inp.closest('.f'); if (!f) return;
  if (inp.dataset.num) { const c = f.querySelector('.calc'); if (c) { const v = inp.value, n = num(v); c.textContent = hasOp(v) ? (isFinite(n) ? '= ' + eur(n) : 'Calcul pas terminé…') : ''; } }
  const h = f.querySelector('.hint'), r = VALID[inp.dataset.k] && VALID[inp.dataset.k](inp.value.trim());
  if (h) { h.className = 'hint ' + (r ? r[0] : ''); h.textContent = r ? r[1] : ''; }
}
document.addEventListener('input', e => {
  const t = e.target;
  if (t.matches('#sheet input[data-k]')) chkField(t);
  else if (t.id === 'mvQ') { mvF.q = t.value; document.getElementById('mvList').innerHTML = mvListHTML(); }
});
document.addEventListener('change', e => { if (e.target.id === 'mvC') { mvF.c = e.target.value; render(); } });
// En quittant le champ, un calcul est remplacé par son résultat (45,20+12,80 → 58,00).
document.addEventListener('focusout', e => { const t = e.target; if (t.dataset && t.dataset.num && hasOp(t.value)) { const n = num(t.value); if (isFinite(n)) { t.value = amtTxt(n); chkField(t); } } });
function calcKey(btn){
  const inp = btn.closest('.f').querySelector('input'), o = btn.dataset.v;
  if (o === '=') { const n = num(inp.value); if (isFinite(n)) inp.value = amtTxt(n); else return toast('Calcul pas valable'); }
  else inp.value = inp.value.replace(/\s*[-+*/×÷−]\s*$/, '') + ({ '−': '-', '×': '×', '÷': '÷' }[o] || o);
  chkField(inp); buzz();
  // On remet le curseur à la fin du champ pour taper le nombre suivant.
  if (o !== '=') { inp.focus(); const n = inp.value.length; try { inp.setSelectionRange(n, n); } catch(e) {} }
}
function readForm(){
  const o = {};
  document.querySelectorAll('#sheet [data-k]').forEach(el => {
    if (el.classList.contains('chips')) { const on = el.querySelector('.on'); o[el.dataset.k] = on ? on.dataset.v : ''; }
    else o[el.dataset.k] = el.value.trim();
  });
  return o;
}
function closeM(){ document.getElementById('modal').classList.remove('on'); formDone = null; if (needR) { needR = false; render(); } if (pendUpd) { pendUpd = false; setTimeout(chkUpd, 800); } }
function needAmt(v){ const a = num(v); if (!(a > 0)) { toast('Indiquez un montant (ex : 45,90)'); return null; } return a; }
const monthOpts = () => { const o = []; for (let i = mi(thisMonth) - 12; i <= mi(thisMonth) + 60; i++) o.push([fromMi(i), mName(fromMi(i))]); return o; };

// Factures
function billForm(b, pre, m = cur){
  const isNew = !b; b = b || Object.assign({ nm:'', amt:'', day:'', c:'loyer', freq:1, start:cur, end:'', auto:0 }, pre || {});
  const rec = !isNew && b.freq !== 0 && due(b, m);
  const vals = Object.assign({}, b, { auto: b.auto ? 1 : 0, ovr: rec && b.ov && b.ov[m] != null ? b.ov[m] : '' });
  form(isNew ? '🧾 Nouvelle facture' : '🧾 Modifier la facture', [
    { k:'c', l:'Type', t:'chips', o:CATS_BILL },
    { k:'nm', l:'Nom', p:'ex : Loyer, Engie, Proximus…' },
    { k:'amt', l: rec ? 'Montant habituel (€)' : 'Montant (€)', t:'num', p:'0,00' }
  ].concat(rec ? [{ k:'ovr', l:`Montant différent juste pour ${mName(m)} ? (sinon laissez vide)`, t:'num', p:'ex : 87,40' }] : []).concat([
    { k:'day', l:'Jour du paiement (1 à 31, facultatif)', t:'text', p:'ex : 5' },
    { k:'auto', l:'Comment c\'est payé ?', t:'sel', o:[[0, 'Je la paie moi-même'], [1, 'Domiciliation (prélevée automatiquement)']] },
    { k:'freq', l:'À payer', t:'sel', o:FREQ },
    { k:'start', l:'À partir de', t:'sel', o:monthOpts() },
    { k:'end', l:'Jusqu\'à (facultatif, ex : fin d\'un crédit)', t:'sel', o:[['', 'Pas de fin']].concat(monthOpts()) },
    { k:'com', l:'Communication (facultatif)', p:'+++123/4567/89012+++' },
    { k:'iban', l:'Compte à payer (IBAN, facultatif)', p:'BE00 0000 0000 0000' },
    { k:'note', l:'Note (facultatif)', p:'ex : numéro de client, à vérifier…' }
  ]), vals, v => {
    const amt = needAmt(v.amt); if (amt == null) return;
    const day = Math.min(31, Math.max(0, parseInt(v.day) || 0));
    if (v.end && mi(v.end) < mi(v.start)) return toast('La fin doit être après le début');
    if (v.iban && !ibanOK(v.iban) && !confirm('Le numéro de compte semble faux (une erreur de lecture ?).\nEnregistrer quand même ?')) return;
    if (v.com && VALID.com(v.com)[0] === 'bad' && !confirm('La communication semble fausse (une erreur de lecture ?).\nEnregistrer quand même ?')) return;
    const ov = Object.assign({}, b.ov || {});
    if (rec) { const o = v.ovr ? num(v.ovr) : NaN; if (v.ovr && !(o >= 0)) return toast('Montant de ce mois pas valable'); if (isFinite(o) && o !== amt) ov[m] = o; else delete ov[m]; }
    touch(Object.assign(b, { nm: v.nm || catName(CATS_BILL, v.c), amt, day, c: v.c, freq: +v.freq, start: v.start, end: v.end,
      com: comOK(v.com) ? fmtCom(v.com) : v.com, iban: v.iban ? fmtIban(v.iban) : '', auto: +v.auto ? 1 : 0, note: v.note, ov: Object.keys(ov).length ? ov : undefined }));
    if (!b.ov) delete b.ov;
    if (isNew) { b.id = uid(); st.bills.push(b); }
    return true;
  }, isNew ? null : () => { gone(b.id); st.bills = st.bills.filter(x => x !== b); });
  const unpaid = !isNew && due(b, m) && !isPaid(b, m);
  if (!isNew && (b.com || b.iban)) document.querySelector('#sheet h3').insertAdjacentHTML('afterend',
    `<div class="card" style="background:var(--bg);box-shadow:none;padding:12px 14px"><div class="sub" style="margin-bottom:8px">Pour payer dans l'appli de la banque :</div><div class="chips">
      ${b.iban ? `<button type="button" data-act="copy2" data-v="${esc(b.iban)}">📋 ${esc(b.iban)}</button>` : ''}
      ${b.com ? `<button type="button" data-act="copy2" data-v="${esc(b.com)}">📋 ${esc(b.com)}</button>` : ''}
      <button type="button" data-act="copy2" data-v="${amtTxt(amtOf(b, m))}">📋 ${eur(amtOf(b, m))}</button></div>
      ${unpaid && b.iban && ibanOK(b.iban) ? `<button type="button" class="btn alt" style="width:100%;margin-top:10px" data-act="payQR" data-id="${b.id}" data-m="${m}">QR code pour payer avec l'appli de la banque</button>` : ''}</div>`);
  if (!isNew) {
    // Arrêter = la facture ne revient plus à partir du mois affiché, les mois passés restent comme ils étaient.
    const del = document.querySelector('#sheet .del');
    del.textContent = '🗑️ Supprimer complètement (aussi les mois passés)';
    if (b.freq !== 0 && mi(m) > mi(b.start)) del.insertAdjacentHTML('beforebegin',
      `<button class="btn alt" style="width:100%;margin-top:14px" onclick="stopBill('${b.id}','${m}')">⏹️ Arrêter à partir de ${esc(mName(m))}</button>`);
  }
}
function stopBill(id, m = cur){
  const b = byId(st.bills, id); if (!b) return;
  b.end = fromMi(mi(m) - 1); touch(b); save(); closeM(); render();
  toast('⏹️ « ' + b.nm + ' » ne revient plus à partir de ' + mName(m));
}

function mvForm(m, t, pre){

  m = m || Object.assign({ t, nm:'', amt:'', c: t === 'in' ? 'autre' : 'courses', d: cur === thisMonth ? today : cur + '-01', who: me() }, pre || {});
  const cats = m.t === 'in' ? CATS_IN : CATS_OUT;
  form(isNew ? (m.t === 'in' ? '＋ Nouvelle rentrée' : '－ Nouvelle dépense') : '✏️ Modifier', [
    { k:'amt', l:'Montant (€)', t:'num', p:'0,00' },
    { k:'c', l:'Catégorie', t:'chips', o:cats },
    { k:'nm', l:'Détail (facultatif)', p: m.t === 'in' ? 'ex : prime, remboursement…' : 'ex : Delhaize, essence…' },
    { k:'d', l:'Date', t:'date' },
    { k:'who', l:'Qui ? (facultatif)', p:'ex : Nico' },
    { k:'note', l:'Note (facultatif)', p:'ex : remboursé par la mutuelle…' }
  ].concat(m.t === 'in' && st.inc.length ? [{ k:'rep', l:'Remplace un salaire habituel ce mois-là ?', t:'sel', o:[['', 'Non, c\'est en plus']].concat(st.inc.map(i => [i.id, 'Oui : ' + i.nm])) }] : []),
  m, v => {
    const amt = needAmt(v.amt); if (amt == null) return;
    if (!/^\d{4}-\d\d-\d\d$/.test(v.d)) return toast('Choisissez une date');
    const mo = v.d.slice(0, 7), bud = m.t === 'out' ? budOf(v.c) : 0, before = bud ? spentOf(mo, v.c) - (isNew || m.c !== v.c || m.d.slice(0, 7) !== mo ? 0 : m.amt) : 0;
    touch(Object.assign(m, { amt, c: v.c, nm: v.nm, d: v.d, who: v.who, note: v.note }));
    if ('rep' in v) m.rep = v.rep;
    if (isNew) { m.id = uid(); st.mv.push(m); }
    if (mo !== cur) { cur = mo; }
    // Alerte budget : à 80 % et à 100 % du plafond de la catégorie
    if (bud) { const after = before + amt, cn = catName(CATS_OUT, v.c);
      if (after > bud && before <= bud) return '⚠️ Budget ' + cn + ' dépassé (' + eur(after) + ' / ' + eur(bud) + ')';
      if (after >= bud * 0.8 && before < bud * 0.8) return '⚠️ Budget ' + cn + ' : ' + Math.round(after / bud * 100) + ' % utilisé'; }
    return true;
  }, isNew ? null : () => { gone(m.id); st.mv = st.mv.filter(x => x !== m); });
}

function depForm(g, sign){
  const lastAcc = (st.dep.filter(d => d.g === g.id && d.acc).pop() || {}).acc || (st.acc[0] || {}).id || '';
  form(sign > 0 ? `🐷 Mettre de côté pour « ${esc(g.nm)} »` : `Retirer de « ${esc(g.nm)} »`, [
    { k:'amt', l:'Montant (€)', t:'num', p:'0,00' },
    { k:'d', l:'Date', t:'date' }
  ].concat(st.acc.length ? [{ k:'acc', l: sign > 0 ? 'Sur quel compte épargne ?' : 'De quel compte épargne ?', t:'sel', o: st.acc.map(a => [a.id, a.nm]).concat([['', 'Aucun / ailleurs']]) }] : []),
  { d: cur === thisMonth ? today : cur + '-01', acc: lastAcc }, v => {
    const amt = needAmt(v.amt); if (amt == null) return;
    if (sign < 0 && amt > goalSaved(g) + 0.001) return toast('Il n\'y a que ' + eur(goalSaved(g)) + ' de côté');
    st.dep.push({ id: uid(), g: g.id, acc: v.acc || '', amt: amt * sign, d: v.d || today, who: me(), u: Date.now() });
    if (sign > 0 && goalSaved(g) >= g.target) setTimeout(() => toast('🎉 Bravo, objectif « ' + g.nm + ' » atteint !'), 300);
    return true;
  });
}

// ---------- Annuler une suppression (5 secondes) ----------
let undoPrev = null, undoT;
const snap = () => JSON.parse(JSON.stringify(st));
function offerUndo(prev, msg){

// Montants au format belge/français : 2.345,67 · 2 345,67 · 2345,67 (accepte aussi le point décimal).
function amounts(line, min = 50){

}
function parseSlip(text){

    [/salaire\s*net|r[ée]mun[ée]ration\s*nette|montant\s*net|nettoloon|netto\s*bedrag|net\s*pay/i, 2], [/\bnet\b|\bnetto\b/i, 1]];
  const bad = /imposable|belastbaar|brut|bruto|cumul|ann[ée]e/i;
  let best = null; const all = new Map();
  L.forEach((l, i) => {

    const k = KW.find(k => k[0].test(l)); if (!k) return;
    if (bad.test(l) && k[1] < 3) return;
    let a = amounts(l); if (!a.length && L[i + 1]) a = amounts(L[i + 1]);

async function findQR(canvas){

    es.addEventListener('put', on); es.addEventListener('patch', on); es.onerror = () => setSy('err'); } catch(e) {}
}
// Invitation : lien + code, à n'envoyer qu'à son/sa partenaire.
function sendApp(){
  const u = location.origin + location.pathname;
  const txt = '💶 Notre appli Payement (factures, dépenses, épargne) : ' + u + '\nTape notre mot de famille à l\'ouverture 😉';
  if (navigator.share) navigator.share({ text: txt }).catch(() => {});
  else (navigator.clipboard ? navigator.clipboard.writeText(u) : Promise.reject()).then(() => toast('Lien copié 📋'), () => prompt('Copiez ce lien :', u));
}
async function setSec(v){
  SEC = v; try { localStorage.setItem('pay_secret', v); } catch(e) {}
  await initKey(); startStream();
}
// Récupère ce qui était à l'ancienne adresse non chiffrée, puis l'efface.
async function takeOld(){
  try {
    const r = await fetch(OLD_URL, { cache:'no-store' }); if (!r.ok) return;
    const old = norm(await r.json());
    if (old) { unpack(merge(pack(st), old)); fetch(OLD_URL, { method:'DELETE' }).catch(() => {}); }
  } catch(e) {}
}
async function createSpace(){
  await takeOld(); await setSec(newSec()); await sync(); render();
  document.getElementById('spc').innerHTML = `<h2>✅ Votre espace est prêt</h2>
    <p>Envoyez maintenant l'invitation à votre partenaire (par Messenger, WhatsApp…). Une seule fois suffit.</p>
    <button class="btn" onclick="sendApp()">📤 Envoyer l'invitation</button>
    <p class="help">⚠️ Ne l'envoyez qu'à votre partenaire : avec ce lien, on peut voir vos chiffres. Gardez ce message, il sert aussi de secours.</p>
    <button class="btn alt" onclick="spaceDone()">Continuer</button>`;
}
async function joinSpace(code){
  const c = cleanSec(code);
  if (c.length !== 26 || [...c].some(ch => !ALPHA.includes(ch))) return toast('❌ Code pas valable : vérifiez-le');
  if (c === SEC) { spaceDone(); return toast('Vous êtes déjà dans cet espace ✓'); }
  const had = st.bills.length + st.inc.length + st.mv.length + st.goals.length;
  if (SEC && had && !confirm('Rejoindre ce budget partagé ? Ce que ce téléphone contient sera remplacé.')) return;
  if (SEC) st = blank();
  await setSec(c); await sync(); spaceDone(); render(); toast('✅ Vous êtes connectés : vous voyez le même budget');
}
function spaceScreen(){
  document.getElementById('spc').innerHTML = `<h2>🔐 Votre budget privé</h2>
    <p>Vos chiffres sont <b>chiffrés</b> : seuls vos deux téléphones peuvent les lire.</p>
    <div class="st"><span class="num">1</span><div>Le <b>premier</b> crée l'espace…</div></div>
    <button class="btn" onclick="createSpace()">✨ Créer notre espace</button>
    <div class="st"><span class="num">2</span><div>…et envoie une <b>invitation</b> à l'autre. Vous avez reçu une invitation ? Collez-la ici :</div></div>
    <input id="joinIn" class="codein" placeholder="xxxx-xxxx-xxxx-…" autocomplete="off" autocapitalize="off">
    <button class="btn alt" onclick="joinSpace(document.getElementById('joinIn').value)">📩 Rejoindre</button>`;
  document.getElementById('sp').classList.add('on');
}
function spaceDone(){ document.getElementById('sp').classList.remove('on'); onboard(); }
function famScreen(){
  document.getElementById('spc').innerHTML = `<h2>🔐 Votre mot de famille</h2>
    <p>Tapez le mot que vous avez choisi à deux. <b>Le même sur vos deux téléphones</b> : vous verrez le même budget. Une seule fois suffit.</p>
    <input id="famIn" class="codein" style="font-family:inherit" placeholder="Votre mot de famille" autocomplete="off" autocapitalize="off" type="password">
    <button class="btn" id="famOk">Entrer</button>
    <p class="help">Les majuscules et les espaces ne comptent pas.</p>`;
  document.getElementById('sp').classList.add('on');
  const go = async () => {
    const w = document.getElementById('famIn').value;
    if (normWord(w).length < 3) return toast('Tapez votre mot de famille');
    const btn = document.getElementById('famOk'); btn.disabled = true; btn.textContent = '⏳ Un instant…';
    try {
      const k = await famKey(w);
      // Ce que ce téléphone avait déjà (ancien espace, ancienne adresse) est gardé et rejoint le budget commun.
      let old = ''; try { old = localStorage.getItem('pay_secret') || ''; } catch(e) {}
      if (old) { SEC = old; await initKey(); try { const r = await fetch(famURL(), { cache:'no-store' }); if (r.ok) { const m = norm(await unseal(await r.json())); if (m) unpack(merge(pack(st), m)); } } catch(e) {} }
      if (!localStorage.getItem('pay_old')) { await takeOld(); localStorage.setItem('pay_old', '1'); }
      SEC = k; await initKey();
      let empty = true;
      try { const r = await fetch(famURL(), { cache:'no-store' }); if (r.ok) empty = !(await r.json()); } catch(e) {}
      try { localStorage.setItem('pay_fam', k); localStorage.removeItem('pay_secret'); } catch(e) {}
      startStream(); await sync(); render(); spaceDone();
      toast(empty ? '✨ Nouveau budget créé. L\'autre téléphone doit taper exactement le même mot.' : '✅ Connecté : vous voyez le même budget');
    } catch(e) { btn.disabled = false; btn.textContent = 'Entrer'; toast('❌ Problème, réessayez'); }
  };
  document.getElementById('famOk').onclick = go;
  document.getElementById('famIn').onkeydown = e => { if (e.key === 'Enter') go(); };
}
setInterval(sync, 30000);

// ---------- Installation sur l'écran d'accueil ----------
const UA = navigator.userAgent;
const standalone = () => matchMedia('(display-mode: standalone)').matches || matchMedia('(display-mode: fullscreen)').matches || navigator.standalone === true;
const isIOS = /iphone|ipad|ipod/i.test(UA) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const isAndroid = /Android/i.test(UA);
const inApp = () => /; wv\)|FBAN|FBAV|FB_IAB|Messenger|Instagram|WhatsApp|Snapchat|TikTok|GSA\//.test(UA);
const appName = () => /WhatsApp/.test(UA) ? 'WhatsApp' : /Messenger|FBAN|FBAV|FB_IAB/.test(UA) ? 'Messenger' : /Instagram/.test(UA) ? 'Instagram' : /Snapchat/.test(UA) ? 'Snapchat' : 'une autre application';
let dp = null;
addEventListener('beforeinstallprompt', e => { e.preventDefault(); dp = e; if (document.getElementById('ins').classList.contains('on')) showIns(1); else render(); });
addEventListener('appinstalled', () => { dp = null; hideIns(); toast('Payement est installée 🎉'); render(); });
function install(){ if (!dp) return; dp.prompt(); dp.userChoice.then(c => { if (c && c.outcome === 'accepted') hideIns(); }).finally(() => { dp = null; render(); }); }
const URL0 = () => location.origin + location.pathname;
function copyLink(){ const u = URL0(); (navigator.clipboard ? navigator.clipboard.writeText(u) : Promise.reject()).then(() => toast('Lien copié ✓'), () => prompt('Copiez ce lien :', u)); }
function openSafari(){ location.href = 'x-safari-' + URL0(); setTimeout(() => toast('Si rien ne s\'ouvre : suivez les étapes'), 1500); }
function openChrome(){ const u = URL0(); location.href = 'intent://' + u.replace(/^https?:\/\//, '') + '#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url=' + encodeURIComponent(u) + ';end'; }
const stp = (n, h) => `<div class="st"><span class="num">${n}</span><div>${h}</div></div>`;
function insHTML(){
  if (inApp() && isIOS) return `<h2>Encore une petite étape 💶</h2><p>Le lien s'est ouvert dans <b>${appName()}</b>. Pour installer Payement, il faut l'ouvrir dans <b>Safari</b>.</p>
    <button class="btn" onclick="openSafari()">🧭 Ouvrir dans Safari</button>
    <p class="help" style="margin-top:14px">Si le bouton ne marche pas :</p>
    ${stp(1, 'Touchez <b>⋯</b> ou <b>⬆️</b>')}${stp(2, 'Choisissez <b>« Ouvrir dans Safari »</b> 🧭')}
    <button class="btn alt" onclick="copyLink()">📋 Copier le lien</button>`;
  if (inApp() && isAndroid) return `<h2>Encore une petite étape 💶</h2><p>Le lien s'est ouvert dans <b>${appName()}</b>. Pour installer Payement, il faut l'ouvrir dans <b>Chrome</b>.</p>
    <button class="btn" onclick="openChrome()">🌐 Ouvrir dans Chrome</button>
    ${stp(1, 'Sinon : touchez <b>⋮</b> en haut à droite')}${stp(2, 'Choisissez <b>« Ouvrir dans Chrome »</b>')}`;
  if (dp) return `<h2>Installez Payement 💶</h2><p>Elle sera sur votre écran d'accueil, comme une vraie application.</p><button class="btn" onclick="install()">📲 Installer</button>`;
  if (isIOS) return `<h2>Installez Payement 💶</h2><p>3 petites étapes et elle sera sur votre écran d'accueil :</p>
    ${stp(1, 'Touchez le bouton <b>Partager ⬆️</b> (en bas ou dans la barre d\'adresse)')}
    ${stp(2, 'Faites défiler et touchez <b>« Sur l\'écran d\'accueil »</b> ➕')}
    ${stp(3, 'Touchez <b>« Ajouter »</b> en haut à droite')}
    <p class="help">Ensuite, ouvrez Payement depuis l'icône sur votre écran.</p>`;
  if (isAndroid) return `<h2>Installez Payement 💶</h2>${stp(1, 'Touchez <b>⋮</b> en haut à droite de Chrome')}${stp(2, 'Choisissez <b>« Installer l\'application »</b> ou <b>« Ajouter à l\'écran d\'accueil »</b>')}
    <button class="btn alt" onclick="openChrome()">🌐 Pas dans le menu ? Ouvrir dans Chrome</button>`;
  return `<h2>Payement 💶</h2><p>Ouvrez ce lien sur votre téléphone pour installer Payement.</p><button class="btn alt" onclick="copyLink()">📋 Copier le lien</button>`;
}
function showIns(force){
  if (standalone()) return;
  if (!force) { try { if (Date.now() - (+localStorage.getItem('pay_ins') || 0) < 864e5) return false; } catch(e) {} }
  document.getElementById('insc').innerHTML = insHTML(); document.getElementById('ins').classList.add('on'); return true;
}
function hideIns(){ document.getElementById('ins').classList.remove('on'); onboard(); }
// Étapes du premier lancement, dans l'ordre : installer → espace privé → prénom → code d'accès.
function onboard(){
  if (document.getElementById('ins').classList.contains('on') || document.getElementById('lock').classList.contains('on')) return;
  if (!SEC) return famScreen();
  if (!me()) return setTimeout(whoSheet, 300);
  if (!localStorage.getItem('pay_thc') && !formDone) setTimeout(() => { if (!formDone && !document.getElementById('lock').classList.contains('on')) { try { localStorage.setItem('pay_thc', '1'); } catch(e) {} themeSheet(); } }, 600);
}
function insLater(){ try { localStorage.setItem('pay_ins', Date.now()); } catch(e) {} hideIns(); }

// ---------- Mises à jour : automatiques, sinon bouton « Mettre à jour » ----------
let SWR = null, pendUpd = false;
// Pas de rechargement pendant une saisie : la mise à jour attend que la fenêtre soit fermée.
const busy = () => !!formDone || ['modal', 'sp', 'ins'].some(id => document.getElementById(id).classList.contains('on'))
  || (document.getElementById('lock').classList.contains('on') && pinMode !== 'unlock')
  || !!(document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName));
if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js?v=' + APPV).then(r => { SWR = r; }).catch(() => {});
function chkUpd(man){
  if (SWR) SWR.update().catch(() => {});
  fetch('version.json?' + Date.now(), { cache:'no-store' }).then(r => r.ok ? r.json() : null).then(j => {
    if (!j || !j.v || j.v === APPV) { if (man) toast('Payement est à jour ✓'); return; }
    // On recharge tout seul (une seule fois par version), sauf si une fenêtre de saisie est ouverte.
    let tried = ''; try { tried = localStorage.getItem('pay_auto') || ''; } catch(x) {}
    if (tried !== j.v && busy()) { pendUpd = true; return; }
    if (tried !== j.v) {
      try { localStorage.setItem('pay_auto', j.v); } catch(x) {}
      (SWR ? SWR.update().catch(() => {}) : Promise.resolve()).then(() => location.reload()); return;
    }
    document.getElementById('updn').textContent = j.notes || ''; document.getElementById('upd').classList.add('on');
  }).catch(() => { if (man) toast('Pas de connexion'); });
}
try { const o = localStorage.getItem('pay_v'); localStorage.setItem('pay_v', APPV); if (o && o !== APPV) setTimeout(() => toast('Payement a été mise à jour ✨'), 600); } catch(e) {}
setInterval(chkUpd, 30 * 60000);
let hiddenAt = 0;
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { hiddenAt = Date.now(); return; }
  if (pinH() && Date.now() - hiddenAt > 60000) lockScreen();
  chkUpd(); sync(); if (!formDone) render();
});

// ---------- Code d'accès et empreinte (propres à chaque téléphone) ----------
// pay_pin = empreinte SHA-256 du code (jamais le code lui-même) ; pay_bio = identifiant WebAuthn de l'empreinte de ce téléphone.
const pinH = () => { try { return localStorage.getItem('pay_pin') || ''; } catch(e) { return ''; } };
const bioId = () => { try { return localStorage.getItem('pay_bio') || ''; } catch(e) { return ''; } };
const hashPin = async p => hex(await sha('payement-pin:' + p));
let pinMode = 'unlock', pinBuf = '', pinFirst = '', pinFails = 0, pinWait = 0;
function lockScreen(){ pinMode = 'unlock'; pinBuf = ''; drawLock(); document.getElementById('lock').classList.add('on'); if (bioId() && !isIOS) setTimeout(bioUnlock, 300); }
function pinSetup(){ pinMode = 'set1'; pinBuf = ''; drawLock(); document.getElementById('lock').classList.add('on'); }
function drawLock(){
  const t = { unlock: '🔒 Entrez votre code', set1: 'Choisissez un code à 4 chiffres', set2: 'Retapez le code pour confirmer' }[pinMode];
  const k = [1,2,3,4,5,6,7,8,9].map(n => `<button onclick="pinKey('${n}')">${n}</button>`).join('');
  document.getElementById('lock').innerHTML = `<div class="lk">
    <div class="lkico">€</div><h2>${t}</h2>
    <div class="dots">${[0,1,2,3].map(i => `<i class="${i < pinBuf.length ? 'on' : ''}"></i>`).join('')}</div>
    <div class="pad">${k}
      ${pinMode === 'unlock' && bioId() ? '<button onclick="bioUnlock()" aria-label="Empreinte">👆</button>' : '<span></span>'}
      <button onclick="pinKey('0')">0</button><button onclick="pinKey('del')" aria-label="Effacer">⌫</button></div>
    ${pinMode === 'unlock' ? '<button class="later" onclick="pinForgot()">Code oublié ?</button>' : '<button class="later" onclick="pinCancel()">Annuler</button>'}
  </div>`;
}
async function pinKey(k){
  if (k === 'del') { pinBuf = pinBuf.slice(0, -1); return drawLock(); }
  if (pinBuf.length >= 4) return;
  if (pinMode === 'unlock' && Date.now() < pinWait) return toast('Trop d\'essais : attendez ' + Math.ceil((pinWait - Date.now()) / 1000) + ' s');
  pinBuf += k; buzz(); drawLock();
  if (pinBuf.length < 4) return;
  if (pinMode === 'unlock') {
    if (await hashPin(pinBuf) === pinH()) { pinFails = 0; unlock(); }
    else { pinFails++; if (pinFails >= 5) { pinWait = Date.now() + 30000; pinFails = 0; } shake(); }
  } else if (pinMode === 'set1') { pinFirst = pinBuf; pinMode = 'set2'; pinBuf = ''; setTimeout(drawLock, 150); }
  else if (pinBuf === pinFirst) {
    try { localStorage.setItem('pay_pin', await hashPin(pinBuf)); } catch(e) {}
    profSave();
    unlock(); toast('🔒 Code enregistré');
    if (await bioAvail() && !bioId()) setTimeout(() => { if (confirm('Utiliser aussi votre empreinte de doigt (ou votre visage) pour ouvrir l\'appli ?')) bioSetup(); }, 400);
    else render();
  } else { pinMode = 'set1'; pinBuf = ''; toast('Les deux codes sont différents, recommencez'); shake(); }
}
function shake(){ pinBuf = ''; setTimeout(() => { drawLock(); const n = document.querySelector('.dots'); if (n) { n.classList.add('bad'); } }, 120); if (navigator.vibrate) navigator.vibrate(150); }
function unlock(){ document.getElementById('lock').classList.remove('on'); pinBuf = ''; onboard(); render(); }
function pinCancel(){ document.getElementById('lock').classList.remove('on'); pinBuf = ''; render(); }
function pinOff(){ if (!confirm('Enlever le code d\'accès sur ce téléphone ?')) return; try { localStorage.removeItem('pay_pin'); localStorage.removeItem('pay_bio'); } catch(e) {} profSave(); render(); toast('Code enlevé'); }
async function pinForgot(){
  if (!confirm('Code oublié ? Ce téléphone va être remis à zéro.\n\nVos chiffres restent en sécurité en ligne : il suffira de retaper votre mot de famille.')) return;
  // Le code oublié est aussi retiré du profil, sinon il serait redemandé après avoir retapé le mot de famille.
  const p = byId(st.prof, myProfId());
  if (p) { touch(Object.assign(p, { pin: '', bio: '' })); saveLocal(); try { await sync(); } catch(e) {} }
  try { Object.keys(localStorage).filter(k => k.startsWith('pay_')).forEach(k => localStorage.removeItem(k)); } catch(e) {}
  location.reload();
}
// Empreinte / visage : WebAuthn avec l'authentificateur du téléphone, vérification de l'utilisateur obligatoire.
async function bioAvail(){ try { return !!(window.PublicKeyCredential && await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable()); } catch(e) { return false; } }
async function bioSetup(){
  try {
    const c = await navigator.credentials.create({ publicKey: {
      challenge: crypto.getRandomValues(new Uint8Array(32)), rp: { name: 'Payement' },
      user: { id: crypto.getRandomValues(new Uint8Array(16)), name: me() || 'Payement', displayName: me() || 'Payement' },
      pubKeyCredParams: [{ type:'public-key', alg:-7 }, { type:'public-key', alg:-257 }],
      authenticatorSelection: { authenticatorAttachment:'platform', userVerification:'required', residentKey:'discouraged' }, timeout: 60000 } });
    localStorage.setItem('pay_bio', b64(new Uint8Array(c.rawId))); profSave(); toast('👆 Empreinte activée'); render();
  } catch(e) { toast('Empreinte pas activée'); render(); }
}
async function bioUnlock(){
  if (!bioId()) return;
  try {
    await navigator.credentials.get({ publicKey: { challenge: crypto.getRandomValues(new Uint8Array(32)),
      allowCredentials: [{ type:'public-key', id: unb64(bioId()) }], userVerification:'required', timeout: 60000 } });
    unlock();
  } catch(e) {}
}
function bioOff(){ try { localStorage.removeItem('pay_bio'); } catch(e) {} profSave(); render(); toast('Empreinte désactivée'); }

// Lien d'invitation : …/#rejoindre=CODE
function readInvite(){
  const m = location.hash.match(/rejoindre=([a-z0-9-]+)/i);
  if (!m) return '';
  history.replaceState(null, '', location.pathname);
  return m[1];
}

(async () => {
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch(e) {}
  readInvite();
  if (pinH()) lockScreen();
  render();
  await initKey();
  setSy(''); startStream(); sync().then(() => { if (SEC && me() && !byId(st.prof, myProfId())) profSave(); }); chkUpd();
  if (!showIns()) onboard();
})();
</script>
