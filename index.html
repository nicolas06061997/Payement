<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Payement</title>
<meta name="theme-color" content="#f6f2f0" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#141113" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Payement">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&family=Nunito:wght@400;600;700;800&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f2f0;--card:#ffffff;--ink:#1f1a1d;--mute:#8d8489;--line:#eee7e4;--soft:#f7ecec;
  --brand:#c43d5c;--brand2:#f08a5d;--in:#16a065;--out:#e2474b;--sav:#3d72d8;--warn:#d98a00;
  --inS:#e5f6ee;--outS:#fdeaea;--savS:#e8effc;
  --shadow:0 1px 2px rgba(60,20,30,.04),0 6px 20px rgba(60,20,30,.06);
  --r:22px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#141113;--card:#1f1a1d;--ink:#f5eff2;--mute:#a69ca1;--line:#2f282b;--soft:#33232a;
  --brand:#e85a78;--brand2:#f59a6e;--in:#3cc98a;--out:#ff6b6b;--sav:#74a1f0;--warn:#f0b040;
  --inS:#183327;--outS:#3a1d1f;--savS:#1b2740;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* en-tête */
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px}
.hbar{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--brand2),var(--brand));display:grid;place-items:center;color:#fff;font-weight:800;font-size:17px;flex:none}
header h1{margin:0;font-size:19px;font-weight:800;letter-spacing:-.3px;flex:1}
.month{display:flex;align-items:center;background:var(--card);border-radius:999px;box-shadow:var(--shadow);padding:3px}
.month button{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--mute)}
.month button:active{background:var(--soft)}
.month button svg.i{width:18px;height:18px}
.month span{font-weight:700;font-size:14px;text-transform:capitalize;min-width:104px;text-align:center}
.sy{width:10px;height:10px;border-radius:50%;background:var(--mute);flex:none;font-size:0}
.sy.ok{background:var(--in);box-shadow:0 0 0 4px var(--inS)}.sy.err{background:var(--warn)}
main{max-width:640px;margin:0 auto;padding:6px 16px 16px}
/* blocs */
.card{background:var(--card);border-radius:var(--r);padding:16px 18px;margin-bottom:14px;box-shadow:var(--shadow)}
.card h2{margin:0 0 8px;font-size:16px;font-weight:700;letter-spacing:-.2px}
.sec{display:flex;align-items:center;justify-content:space-between;margin:22px 4px 10px}
.sec h3{margin:0;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--mute)}
.sec a,.sec button{font-size:14px;font-weight:700;color:var(--brand)}
h2.t{margin:18px 4px 10px;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--mute)}
.big{text-align:center;padding:22px 18px}
.big .lbl{color:var(--mute);font-size:14px}
.big .val{font-size:40px;font-weight:800;margin:2px 0;letter-spacing:-1px}
/* carte principale */
.hero{position:relative;overflow:hidden;border-radius:28px;padding:22px 20px 18px;margin:4px 0 16px;color:#fff;
  background:linear-gradient(135deg,var(--brand2) 0%,var(--brand) 70%);box-shadow:0 14px 34px color-mix(in srgb,var(--brand) 35%,transparent)}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.1)}
.hero::before{width:220px;height:220px;right:-70px;top:-90px}.hero::after{width:140px;height:140px;left:-50px;bottom:-70px}
.hero>*{position:relative}
.hero.blue{background:linear-gradient(135deg,#5b9bf0 0%,#3557c9 75%);box-shadow:0 14px 34px rgba(53,87,201,.3)}
.hero .lbl{font-size:14px;opacity:.9;font-weight:500}
.hero .val{font-size:44px;font-weight:800;letter-spacing:-1.5px;line-height:1.1;margin:4px 0 2px}
.hero .val small{font-size:24px;font-weight:700;opacity:.85;letter-spacing:-.5px}
.hero .note{font-size:13px;opacity:.85}
.hbar2{height:8px;border-radius:6px;background:rgba(255,255,255,.25);margin:16px 0 14px;overflow:hidden;display:flex}
.hbar2 i{display:block;height:100%}
.hst{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.hst div{background:rgba(255,255,255,.14);border-radius:14px;padding:9px 10px}
.hst span{display:block;font-size:11.5px;opacity:.9;font-weight:600}
.hst b{font-size:15px;font-weight:800;white-space:nowrap;letter-spacing:-.3px}
/* actions rapides */
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:6px}
.qa button{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--ink);white-space:nowrap}
.qa .c{width:56px;height:56px;border-radius:20px;display:grid;place-items:center;background:var(--card);box-shadow:var(--shadow)}
.qa .c svg.i{width:24px;height:24px}
.qa button:active .c{transform:scale(.93)}
.qa .g{color:var(--in);background:var(--inS)}.qa .r{color:var(--out);background:var(--outS)}.qa .b{color:var(--sav);background:var(--savS)}.qa .o{color:var(--brand);background:var(--soft)}
/* lignes */
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .l{display:flex;align-items:center;gap:12px;min-width:0}
.row .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.row .sub,.sub{color:var(--mute);font-size:13px}
.ico{width:42px;height:42px;border-radius:14px;background:var(--soft);display:grid;place-items:center;font-size:20px;flex:none}
.amt{font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums;letter-spacing:-.2px}
.in{color:var(--in)}.out{color:var(--out)}.sav{color:var(--sav)}.warn{color:var(--warn)}.mute{color:var(--mute)}
.tap{cursor:pointer}.tap:active{opacity:.6}
.chk{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;font-size:15px;font-weight:800;transition:.15s}
.chk.on{background:var(--in);border-color:var(--in);color:#fff}
.done .nm{text-decoration:line-through;color:var(--mute)}.done .ico{filter:grayscale(1);opacity:.6}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin:8px 0 6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--brand2),var(--brand));border-radius:6px}
.bar.g i{background:var(--in)}.bar.b i{background:var(--sav)}
/* boutons */
.btns{display:flex;gap:10px;margin-bottom:14px}
.btn{flex:1;padding:14px 12px;border-radius:16px;background:var(--brand);color:#fff;font-weight:700;font-size:15.5px}
.btn.alt{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.btn.in{background:var(--in);color:#fff}.btn.out{background:var(--out);color:#fff}
.btn.small{flex:none;padding:9px 14px;font-size:14px;border-radius:12px}
.card .btn.alt{background:var(--bg);box-shadow:none}
.btn:active{transform:scale(.97)}
.empty{text-align:center;color:var(--mute);padding:18px 6px;font-size:15px}
.card.empty{padding:26px 18px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.mini{background:var(--card);border-radius:18px;padding:13px 14px;box-shadow:var(--shadow)}
.mini .lbl{font-size:13px;color:var(--mute)}.mini .amt{font-size:19px}
/* démarrage */
.steps .row{gap:12px}
.stepn{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;flex:none;background:var(--soft);color:var(--brand)}
.stepn.ok{background:var(--in);color:#fff}
/* barre du bas */
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;max-width:120px;padding:4px 2px;font-size:11px;font-weight:600;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:3px}
nav button .p{width:52px;height:30px;border-radius:15px;display:grid;place-items:center;transition:.2s}
nav button.on{color:var(--brand)}
nav button.on .p{background:var(--soft)}
/* fenêtre */
#modal{position:fixed;inset:0;z-index:10;background:rgba(20,10,15,.45);display:none;align-items:flex-end;justify-content:center}
#modal.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:640px;border-radius:26px 26px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom));
  max-height:92vh;overflow:auto;animation:up .22s ease-out}
.sheet::before{content:"";display:block;width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet h3{margin:0 0 16px;font-size:20px;font-weight:800;letter-spacing:-.3px}
.f{margin-bottom:14px}
.f label{display:block;font-size:13px;font-weight:600;color:var(--mute);margin-bottom:6px}
.f input,.f select{width:100%;padding:13px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:17px;outline:none}
.f input:focus,.f select:focus{border-color:var(--brand)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{padding:8px 13px;border-radius:999px;background:var(--bg);border:1.5px solid var(--line);font-size:14px;font-weight:600}
.chips button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.sheet .btns{margin:18px 0 0}
.del{color:var(--out);width:100%;padding:12px;margin-top:8px;font-weight:700}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(10px);background:#1f1a1d;color:#fff;
  padding:11px 18px;border-radius:999px;font-size:14px;font-weight:600;z-index:50;opacity:0;transition:.25s;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%)}
textarea{width:100%;min-height:90px;padding:10px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:13px monospace}
.cat{display:flex;align-items:center;gap:10px;margin:9px 0;font-size:14px}
.cat .bar{flex:1;margin:0;height:8px}
.cat .amt{min-width:84px;text-align:right;font-size:14px}
p.help{color:var(--mute);font-size:14px;margin:2px 0 10px}
/* mise à jour, installation, espace, verrou */
#upd{position:fixed;left:12px;right:12px;bottom:calc(92px + env(safe-area-inset-bottom));z-index:9;display:none;gap:10px;align-items:center;background:var(--ink);color:var(--bg);
  padding:14px 14px 14px 16px;border-radius:20px;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:620px;margin:0 auto}
#upd.on{display:flex}#upd>div{flex:1;line-height:1.3}#upd small{display:block;opacity:.8;font-size:13px}
#upd button{background:var(--brand);color:#fff;font-weight:800;border-radius:12px;padding:10px 14px;white-space:nowrap}
#ins,#sp{position:fixed;inset:0;z-index:30;background:var(--bg);display:none;flex-direction:column;justify-content:center;
  padding:calc(24px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom));overflow:auto}
#sp{z-index:25}
#ins.on,#sp.on{display:flex}#insc,#spc{max-width:460px;margin:0 auto;width:100%}
#ins h2,#sp h2{font-size:27px;font-weight:800;letter-spacing:-.5px;margin:0 0 10px}#ins p,#sp p{font-size:16px;margin:0 0 16px}
#ins .btn,#sp .btn{display:block;width:100%;font-size:17px;padding:16px;margin:8px 0}
#ins .st,#sp .st{display:flex;gap:14px;align-items:center;background:var(--card);border-radius:18px;padding:14px;margin:10px 0;box-shadow:var(--shadow);font-size:16px}
#ins .st .num,#sp .st .num{font-weight:800;flex:none;width:34px;height:34px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center}
#ins .later,#lock .later{margin:18px auto 0;color:var(--mute);font-weight:700;padding:10px;display:block}
#ins .arrow{text-align:center;font-size:40px}
.codein{width:100%;padding:15px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:17px monospace;margin-top:4px}
#lock{position:fixed;inset:0;z-index:40;background:linear-gradient(160deg,var(--brand2),var(--brand) 65%);color:#fff;display:none;align-items:center;justify-content:center;
  padding:calc(20px + env(safe-area-inset-top)) 20px calc(20px + env(safe-area-inset-bottom))}
#lock.on{display:flex}
.lk{width:100%;max-width:340px;text-align:center}
.lkico{width:64px;height:64px;border-radius:22px;background:rgba(255,255,255,.2);display:grid;place-items:center;margin:0 auto;font-size:30px;font-weight:800}
.lk h2{font-size:20px;font-weight:700;margin:16px 0 20px}
.dots{display:flex;justify-content:center;gap:18px;margin-bottom:30px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid #fff;transition:.15s}.dots i.on{background:#fff;transform:scale(1.1)}
.dots.bad{animation:sh .35s}@keyframes sh{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;justify-items:center}
.pad button{width:74px;height:74px;border-radius:50%;background:rgba(255,255,255,.16);color:#fff;font-size:28px;font-weight:600}
.pad button:active{background:rgba(255,255,255,.4)}
#lock .later{color:#fff;opacity:.85}

/* ===== Styles au choix (propres à chaque téléphone : html[data-theme]) ===== */
.tiles,.donut{display:none}
/* A : Nuit violette */
html[data-theme=a]{--bg:#0c0a17;--card:rgba(255,255,255,.055);--ink:#f3f0ff;--mute:#9a92bf;--line:rgba(255,255,255,.09);--soft:rgba(167,139,250,.16);
  --brand:#c06cf0;--brand2:#f472b6;--in:#34d399;--out:#fb7185;--sav:#a78bfa;--warn:#fbbf24;--inS:rgba(16,185,129,.18);--outS:rgba(244,63,94,.18);--savS:rgba(139,92,246,.22);--shadow:none;color-scheme:dark}
html[data-theme=a],html[data-theme=a] body{background:#0c0a17}
html[data-theme=a] body{background:radial-gradient(120% 50% at 85% -5%,#3b1d6e,transparent 60%),radial-gradient(80% 40% at -10% 30%,#4a1640,transparent 60%),#0c0a17;background-attachment:fixed;font-family:Outfit,system-ui,sans-serif;padding-bottom:calc(104px + env(safe-area-inset-bottom))}
[data-theme=a] header{background:rgba(12,10,23,.7)}
[data-theme=a] .card,[data-theme=a] .mini{border:1px solid var(--line)}
[data-theme=a] .month{border:1px solid var(--line)}
[data-theme=a] .hero{background:linear-gradient(145deg,rgba(255,255,255,.13),rgba(255,255,255,.03));border:1px solid rgba(255,255,255,.14);box-shadow:0 20px 50px rgba(139,92,246,.28)}
[data-theme=a] .hero::before,[data-theme=a] .hero::after{display:none}
[data-theme=a] .hero .lbl{color:#c4b5fd}
[data-theme=a] .hero .val{font-size:38px;background:linear-gradient(90deg,#fff,#f0abfc);-webkit-background-clip:text;background-clip:text;color:transparent;padding-right:96px}
[data-theme=a] .hero .note{color:#a39bc4;padding-right:96px}
[data-theme=a] .donut{display:block;position:absolute;right:18px;top:20px;width:88px;height:88px}
[data-theme=a] .hbar2{display:none}[data-theme=a] .hst{margin-top:16px}
[data-theme=a] .hst div{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08)}
[data-theme=a] .hst div:nth-child(1) b{color:#6ee7b7}[data-theme=a] .hst div:nth-child(2) b{color:#fda4af}[data-theme=a] .hst div:nth-child(3) b{color:#c4b5fd}
[data-theme=a] .qa .c{border:0;color:#fff}
[data-theme=a] .qa .g{background:linear-gradient(135deg,#10b981,#059669)}[data-theme=a] .qa .r{background:linear-gradient(135deg,#f43f5e,#be123c)}
[data-theme=a] .qa .b{background:linear-gradient(135deg,#8b5cf6,#6d28d9)}[data-theme=a] .qa .o{background:linear-gradient(135deg,#f59e0b,#ea580c)}
[data-theme=a] .sec button,[data-theme=a] .sec a{color:#f0abfc}
[data-theme=a] nav{left:14px;right:14px;bottom:calc(12px + env(safe-area-inset-bottom));padding:6px;border-radius:24px;border:1px solid var(--line);background:rgba(25,20,45,.88)}
[data-theme=a] nav button.on{color:#f0abfc}
[data-theme=a] .sheet{background:#1a1630}
[data-theme=a] #modal{background:rgba(0,0,0,.6)}
[data-theme=a] .btn.alt{border:1px solid var(--line)}
[data-theme=a] #upd{background:#2a2348;color:#fff}
/* B : Coloré et joyeux */
html[data-theme=b]{--bg:#fff8f1;--card:#ffffff;--ink:#2b2233;--mute:#9a8aa0;--line:#f3e6e0;--soft:#ffe9f0;--brand:#ff5f8f;--brand2:#ff9a6c;
  --in:#1f9d63;--out:#ee4d6c;--sav:#6d5ff0;--warn:#e69a00;--inS:#d8f5e5;--outS:#ffe1df;--savS:#e6e3ff;--shadow:0 6px 20px rgba(43,34,51,.07);--r:26px;color-scheme:light}
html[data-theme=b],html[data-theme=b] body{background:#fff8f1;font-family:Nunito,system-ui,sans-serif}
[data-theme=b] .amt,[data-theme=b] .nm,[data-theme=b] h2,[data-theme=b] .btn{font-weight:800}
[data-theme=b] .hero{box-shadow:0 18px 36px rgba(255,95,143,.35);border-radius:30px}
[data-theme=b] .hero::before{display:none}
[data-theme=b] .hero::after{content:"💸";background:none;width:auto;height:auto;left:auto;bottom:auto;right:14px;top:8px;font-size:58px;transform:rotate(12deg)}
[data-theme=b] .hst{display:none}
[data-theme=b] .hbar2{height:12px;margin-bottom:4px}
[data-theme=b] .tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 0 16px}
.tiles .t{border-radius:24px;padding:14px 16px;color:#2b2233}.tiles .em{font-size:28px;line-height:1}.tiles small{display:block;font-weight:700;font-size:13px;opacity:.7;margin-top:6px}.tiles b{font-size:21px;font-weight:800;letter-spacing:-.3px}
[data-theme=b] .qa .c{border-radius:22px}
[data-theme=b] .sec h3{text-transform:none;letter-spacing:0;font-size:19px;font-weight:800;color:var(--ink)}
[data-theme=b] nav{border-radius:26px 26px 0 0;border-top:0;box-shadow:0 -6px 20px rgba(43,34,51,.06);background:#fff}
[data-theme=b] .ico{border-radius:16px}
/* C : Chic noir et doré */
html[data-theme=c]{--bg:#f6f1e9;--card:#fffaf2;--ink:#1d1a16;--mute:#9a8f80;--line:#ece2d1;--soft:#f1e8d8;--brand:#a8843f;--brand2:#c9a45c;
  --in:#3f7d58;--out:#b4483c;--sav:#7a5a1e;--warn:#b07a12;--inS:#e6efe4;--outS:#f6e3df;--savS:#efe1c3;--shadow:none;color-scheme:light}
html[data-theme=c],html[data-theme=c] body{background:#f6f1e9}
[data-theme=c] .card,[data-theme=c] .mini,[data-theme=c] .month,[data-theme=c] .btn.alt{border:1px solid var(--line)}
[data-theme=c] header h1,[data-theme=c] .sec h3,[data-theme=c] .card h2,[data-theme=c] .sheet h3,[data-theme=c] #ins h2,[data-theme=c] #sp h2{font-family:"Playfair Display",Georgia,serif;font-weight:700;letter-spacing:0}
[data-theme=c] .sec h3{text-transform:none;font-size:21px;color:var(--ink)}
[data-theme=c] .logo{background:#1d1a16;color:#c9a45c;border-radius:50%}
[data-theme=c] .hero{background:linear-gradient(135deg,#1c1a17,#2e2a24);color:#f6efe2;box-shadow:0 20px 40px rgba(28,26,23,.3);border-radius:26px}
[data-theme=c] .hero::before,[data-theme=c] .hero::after{background:none;border:1px solid rgba(201,164,92,.35)}
[data-theme=c] .hero::before{width:260px;height:260px;right:-90px;top:-110px}[data-theme=c] .hero::after{width:180px;height:180px;left:auto;bottom:auto;right:-40px;top:-60px}
[data-theme=c] .hero .lbl{color:#c9a45c;text-transform:uppercase;letter-spacing:1.4px;font-size:12px;font-weight:700}
[data-theme=c] .hero .val{font-family:"Playfair Display",Georgia,serif;font-weight:600;letter-spacing:0}
[data-theme=c] .hero .val small{color:#c9a45c;opacity:1}
[data-theme=c] .hbar2{background:rgba(201,164,92,.2)}
[data-theme=c] .hst div{background:transparent;padding:4px 0}[data-theme=c] .hst span{color:#b9ae9c}
[data-theme=c] .qa .c{border-radius:50%;background:var(--card);border:1px solid #d9cdb8;color:var(--ink)}
[data-theme=c] .ico{border-radius:50%}
[data-theme=c] .chk.on{background:#1d1a16;border-color:#1d1a16;color:#c9a45c}
[data-theme=c] .bar i{background:#a8843f}[data-theme=c] .bar.g i{background:#3f7d58}
[data-theme=c] nav button.on{color:var(--ink)}[data-theme=c] nav button.on .p{background:transparent;color:#a8843f}
[data-theme=c] #lock{background:linear-gradient(160deg,#2e2a24,#1c1a17)}[data-theme=c] .lkico{color:#c9a45c}
[data-theme=c] .hero.blue{background:linear-gradient(135deg,#7a5a1e,#a8843f)}
/* choix du style */
.thm{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.thm button{border-radius:18px;padding:10px;text-align:left;border:2px solid var(--line);background:var(--bg)}
.thm button.on{border-color:var(--brand)}
.thm .pv{height:58px;border-radius:12px;margin-bottom:8px;position:relative;overflow:hidden}
.thm .pv i{position:absolute;left:8px;right:8px;top:8px;height:24px;border-radius:8px}
.thm b{font-size:14px}.thm small{display:block;color:var(--mute);font-size:12px}
</style>
</head>
<body>
<header><div class="hbar">
  <div class="logo">€</div><h1>Payement</h1>
  <span id="sy" class="sy" title="Partage"></span>
  <div class="month"><button id="prev" aria-label="Mois précédent"><svg class="i" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button><span id="mlbl"></span><button id="next" aria-label="Mois suivant"><svg class="i" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button></div>
</div></header>
<main id="main"></main>
<nav id="nav"></nav>
<div id="modal"><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>
<div id="upd"><div><b>🎉 Nouvelle mise à jour disponible</b><small id="updn"></small></div><button onclick="location.reload()">Mettre à jour</button></div>
<div id="ins"><div id="insc"></div><button class="later" onclick="insLater()">Plus tard</button></div>
<div id="sp"><div id="spc"></div></div>
<div id="lock"></div>
<input type="file" id="slipIn" accept="image/*" hidden>
<input type="file" id="billIn" accept="image/*" hidden>

<script>
'use strict';
const APPV = '2026-11-10.2';
const KEY = 'pay_save';

// ---------- Catégories ----------
const CATS_OUT = [['courses','🛒','Courses'],['maison','🏠','Maison'],['voiture','🚗','Voiture'],['enfants','🧸','Enfants'],
  ['sante','💊','Santé'],['loisirs','🎉','Loisirs'],['resto','🍔','Resto'],['vetements','👕','Vêtements'],['cadeaux','🎁','Cadeaux'],['autre','📦','Autre']];
const CATS_IN = [['salaire','💼','Salaire'],['aide','👶','Allocations'],['vente','🏷️','Vente'],['cadeau','🎁','Cadeau'],['autre','💰','Autre']];
const CATS_BILL = [['loyer','🏠','Loyer / prêt'],['energie','⚡','Gaz / électricité'],['eau','💧','Eau'],['internet','📶','Internet / GSM'],
  ['assurance','🛡️','Assurance'],['voiture','🚗','Voiture'],['abonnement','📺','Abonnement'],['credit','🏦','Crédit'],['creche','🧸','Crèche / école'],['autre','🧾','Autre']];
const QUICK = [['Loyer','loyer'],['Prêt maison','credit'],['Électricité','energie'],['Gaz','energie'],['Eau','eau'],['Internet','internet'],['GSM','internet'],
  ['Assurance auto','assurance'],['Assurance habitation','assurance'],['Mutuelle','assurance'],['Taxe voiture','voiture'],['Netflix','abonnement'],['Spotify','abonnement'],['Crèche','creche'],['Prêt voiture','credit']];
const GOAL_ICO = ['💍','🏡','🚗','✈️','👶','🛋️','🎄','🐷','🎓','💻'];
const FREQ = [[1,'Chaque mois 🔁'],[0,'Une seule fois (ce mois-là)'],[2,'Tous les 2 mois'],[3,'Tous les 3 mois'],[6,'Tous les 6 mois'],[12,'Une fois par an']];
const ico = (list, k) => (list.find(c => c[0] === k) || list[list.length - 1])[1];
const catName = (list, k) => (list.find(c => c[0] === k) || list[list.length - 1])[2];

// ---------- Sauvegarde ----------
function blank(){ return { sv:2, bills:[], paid:{}, inc:[], mv:[], goals:[], dep:[], acc:[], prof:[], gone:{} }; }
function load(){
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.sv) return upg(Object.assign(blank(), s)); } catch(e) {}
  return blank();
}
// Ancienne version (sv 1) : factures payées rangées par mois en liste -> carte "mois_id" = {v,u}.
function upg(s){
  if (s.sv < 2) {
    const p = {}, n = Date.now();
    for (const m in s.paid) if (Array.isArray(s.paid[m])) s.paid[m].forEach(id => p[m + '_' + id] = { v: true, u: n });
    s.paid = p; ['bills','inc','mv','goals','dep'].forEach(k => s[k].forEach(x => x.u = x.u || n)); s.sv = 2;
  }
  return s;
}
let st = load();
function saveLocal(){ try { localStorage.setItem(KEY, JSON.stringify(st)); } catch(e) { toast('⚠️ Impossible d\'enregistrer'); } }
let pushT;
function save(){ saveLocal(); clearTimeout(pushT); pushT = setTimeout(sync, 500); }
const gone = id => { st.gone[id] = Date.now(); };
const touch = x => { x.u = Date.now(); return x; };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

// ---------- Dates & montants ----------
const pad = n => String(n).padStart(2, '0');
const now = new Date();
const thisMonth = now.getFullYear() + '-' + pad(now.getMonth() + 1);
const today = thisMonth + '-' + pad(now.getDate());
let cur = thisMonth, tab = 'home';
const mi = m => { const [y, mo] = m.split('-').map(Number); return y * 12 + mo - 1; };
const fromMi = i => Math.floor(i / 12) + '-' + pad(i % 12 + 1);
const mName = m => new Date(+m.slice(0, 4), +m.slice(5, 7) - 1, 1).toLocaleDateString('fr-BE', { month:'long', year:'numeric' });
const EUR = new Intl.NumberFormat('fr-BE', { style:'currency', currency:'EUR' });
const eur = n => EUR.format(Math.round(n * 100) / 100);
const num = s => { const v = parseFloat(String(s).replace(/\s/g, '').replace(',', '.')); return isFinite(v) ? Math.round(v * 100) / 100 : NaN; };
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const dShort = d => new Date(d + 'T12:00').toLocaleDateString('fr-BE', { day:'numeric', month:'short' });

// ---------- Calculs ----------
function due(b, m){
  const d = mi(m) - mi(b.start);
  if (d < 0) return false;
  if (b.end && mi(m) > mi(b.end)) return false;
  if (b.freq === 0) return d === 0;
  return d % (b.freq || 1) === 0;
}
const billsOf = m => st.bills.filter(b => due(b, m)).sort((a, b) => (a.day || 0) - (b.day || 0));
const isPaid = (b, m) => !!(st.paid[m + '_' + b.id] || {}).v;
const incAll = m => st.inc.filter(i => mi(m) >= mi(i.start) && !(i.end && mi(m) > mi(i.end)));
// Une rentrée avec `rep` (ex : fiche de paye) remplace ce mois-là le salaire habituel `rep`.
const replOf = m => new Set(st.mv.filter(v => v.rep && v.d.slice(0, 7) === m).map(v => v.rep));
const incOf = m => { const r = replOf(m); return incAll(m).filter(i => !r.has(i.id)); };
const mvOf = m => st.mv.filter(v => v.d.slice(0, 7) === m).sort((a, b) => b.d.localeCompare(a.d));
const depOf = m => st.dep.filter(v => v.d.slice(0, 7) === m);
const goalSaved = g => st.dep.filter(d => d.g === g.id).reduce((s, d) => s + d.amt, 0);
// Compte épargne : solde de départ + versements/retraits (dep.acc) ; `adj` = correction d'après la banque (intérêts…), pas compté comme « mis de côté ».
const accBal = a => (a.init || 0) + st.dep.filter(d => d.acc === a.id).reduce((s, d) => s + d.amt, 0);
const totSav = () => sum(st.acc, accBal) + sum(st.dep.filter(d => d.g && !d.acc), d => d.amt);
const sum = (a, f) => a.reduce((s, x) => s + f(x), 0);
function totals(m){
  const bills = billsOf(m), mv = mvOf(m);
  const t = {
    inc: sum(incOf(m), i => i.amt) + sum(mv.filter(v => v.t === 'in'), v => v.amt),
    bills: sum(bills, b => b.amt),
    billsPaid: sum(bills.filter(b => isPaid(b, m)), b => b.amt),
    out: sum(mv.filter(v => v.t === 'out'), v => v.amt),
    sav: sum(depOf(m).filter(d => !d.adj), d => d.amt),
    nb: bills.length, nbPaid: bills.filter(b => isPaid(b, m)).length
  };
  t.rest = t.inc - t.bills - t.out - t.sav;
  return t;
}
const monthlyBills = () => sum(st.bills.filter(b => b.freq !== 0 && (!b.end || mi(b.end) >= mi(thisMonth))), b => b.amt / (b.freq || 1));

// ---------- Écrans ----------
const TABS = [['home','home','Accueil'],['bills','bill','Factures'],['mv','wallet','Argent'],['goals','coins','Épargne'],['set','sliders','Réglages']];
const ICONS = {
  home:'M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z',
  bill:'M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6M9 16h3',
  wallet:'M4 7.5A2.5 2.5 0 0 1 6.5 5H18v3M4 7.5V18a2 2 0 0 0 2 2h14V8H6.5A2.5 2.5 0 0 1 4 7.5zM16 14h.01',
  coins:'M12 3c4.4 0 8 1.3 8 3s-3.6 3-8 3-8-1.3-8-3 3.6-3 8-3zM4 6v6c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6',
  sliders:'M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1M15 4v4M9 10v4M17 16v4',
  plus:'M12 5v14M5 12h14', minus:'M5 12h14',
  doc:'M7 3h7l5 5v13H7zM14 3v5h5M10 13h6M10 17h6'
};
const svg = n => `<svg class="i" viewBox="0 0 24 24"><path d="${ICONS[n]}"/></svg>`;
// Montant avec centimes plus petits (carte principale)
const eurH = n => { const t = eur(n), m = t.match(/^(.*?)([,.]\d\d)(\s?€)$/); return m ? `${m[1]}<small>${m[2]}${m[3]}</small>` : t; };
function render(){
  document.getElementById('mlbl').textContent = mName(cur);
  document.getElementById('nav').innerHTML = TABS.map(t =>
    `<button class="${tab === t[0] ? 'on' : ''}" data-tab="${t[0]}"><span class="p">${svg(t[1])}</span>${t[2]}</button>`).join('');
  document.getElementById('main').innerHTML = ({ home, bills, mv, goals, set })[tab]();
  const bb = document.getElementById('bioBtn'); if (bb) bioAvail().then(ok => { if (ok) bb.style.display = ''; });
}

// Anneau (style Nuit) : part des rentrées utilisée par les factures, dépenses et épargne.
function donut(t){
  const base = Math.max(t.inc, t.bills + t.out + t.sav, 1), C = 100;
  const parts = [[t.bills, '#f472b6'], [t.out, '#a78bfa'], [t.sav, '#34d399']];
  let off = 25, arcs = '';
  parts.forEach(([v, c]) => { const l = v / base * C; if (l > 0.5) arcs += `<circle cx="21" cy="21" r="15.9" fill="none" stroke="${c}" stroke-width="5" stroke-dasharray="${l} ${C - l}" stroke-dashoffset="${off}"/>`; off -= l; });
  const pc = t.inc ? Math.round((t.bills + t.out + t.sav) / t.inc * 100) : 0;
  return `<svg class="donut" viewBox="0 0 42 42"><circle cx="21" cy="21" r="15.9" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="5"/>${arcs}
    <text x="21" y="22" text-anchor="middle" fill="#fff" font-size="7.5" font-weight="700">${pc}%</text><text x="21" y="28" text-anchor="middle" fill="#a39bc4" font-size="3.6">utilisé</text></svg>`;
}
// ---------- Styles (propres à chaque téléphone, gardés dans le profil) ----------
const THEMES = [['a', 'Nuit violette', 'Sombre et classe', 'linear-gradient(135deg,#3b1d6e,#0c0a17)', 'linear-gradient(90deg,#f472b6,#8b5cf6)'],
  ['b', 'Coloré', 'Gai et joyeux', '#fff8f1', 'linear-gradient(90deg,#ff9a6c,#ff5f8f)'],
  ['c', 'Chic doré', 'Noir, crème et or', '#f6f1e9', 'linear-gradient(90deg,#1c1a17,#2e2a24)'],
  ['', 'Simple', 'Le style de départ', '#f6f2f0', 'linear-gradient(90deg,#f08a5d,#c43d5c)']];
const curTheme = () => { try { return localStorage.getItem('pay_theme') || ''; } catch(e) { return ''; } };
function applyTheme(t){
  if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme;
  const col = { a: '#0c0a17', b: '#fff8f1', c: '#f6f1e9' }[t];
  document.querySelectorAll('meta[name=theme-color]').forEach(m => { if (col) m.setAttribute('content', col); else m.setAttribute('content', m.media.includes('dark') ? '#141113' : '#f6f2f0'); });
}
function setTheme(t){ try { localStorage.setItem('pay_theme', t); localStorage.setItem('pay_thc', '1'); } catch(e) {} applyTheme(t); profSave(); render(); }
function themePicker(){
  const c = curTheme();
  return `<div class="thm">${THEMES.map(x => `<button class="${c === x[0] ? 'on' : ''}" onclick="setTheme('${x[0]}');${formDone && formDone.thm ? 'closeM()' : ''}">
    <div class="pv" style="background:${x[3]}"><i style="background:${x[4]}"></i></div><b>${x[1]}</b><small>${x[2]}</small></button>`).join('')}</div>`;
}
function themeSheet(){
  formDone = { thm: 1 };
  document.getElementById('sheet').innerHTML = `<h3>🎨 Nouveau : choisissez votre style</h3>
    <p class="help">Seulement sur ce téléphone. Votre femme / votre mari peut choisir un autre style : vous verrez toujours les mêmes chiffres.</p>${themePicker()}
    <p class="help" style="margin-top:12px">Vous pourrez changer quand vous voulez dans ⚙️ Réglages.</p>`;
  document.getElementById('modal').classList.add('on');
}
applyTheme(curTheme());

function home(){
  const t = totals(cur), bl = billsOf(cur), todo = bl.filter(b => !isPaid(b, cur));
  const totSaved = totSav();
  const outCats = {};
  mvOf(cur).filter(v => v.t === 'out').forEach(v => outCats[v.c] = (outCats[v.c] || 0) + v.amt);
  const cats = Object.entries(outCats).sort((a, b) => b[1] - a[1]);
  const max = cats.length ? cats[0][1] : 1;
  const steps = [[st.inc.length || st.mv.some(v => v.t === 'in'), 'Ajoutez vos salaires', 'mv'], [st.bills.length, 'Ajoutez vos factures du mois', 'bills'], [st.acc.length || st.goals.length, 'Ajoutez votre épargne', 'goals']];
  const sorties = t.bills + t.out, base = Math.max(t.inc, sorties + t.sav, 1);
  return `
  <div class="hero">
    ${donut(t)}
    <div class="lbl">Il reste pour ${esc(mName(cur))}</div>
    <div class="val">${eurH(t.rest)}</div>
    <div class="note">${t.rest < 0 ? '⚠️ Plus de sorties que de rentrées' : 'après factures, dépenses et épargne'}</div>
    <div class="hbar2"><i style="width:${t.bills / base * 100}%;background:rgba(255,255,255,.95)"></i><i style="width:${t.out / base * 100}%;background:rgba(255,255,255,.7)"></i><i style="width:${t.sav / base * 100}%;background:rgba(255,255,255,.45)"></i></div>
    <div class="hst">
      <div><span>Rentrées</span><b>${eur(t.inc)}</b></div>
      <div><span>Sorties</span><b>${eur(sorties)}</b></div>
      <div><span>Épargne</span><b>${eur(t.sav)}</b></div>
    </div>
  </div>
  <div class="tiles">
    <div class="t" style="background:#d8f5e5"><div class="em">💼</div><small>Rentrées</small><b>${eur(t.inc)}</b></div>
    <div class="t" style="background:#ffe1df"><div class="em">🧾</div><small>Factures</small><b>${eur(t.bills)}</b></div>
    <div class="t" style="background:#fff1c7"><div class="em">🛒</div><small>Dépenses</small><b>${eur(t.out)}</b></div>
    <div class="t" style="background:#e6e3ff"><div class="em">🐷</div><small>Épargne</small><b>${eur(t.sav)}</b></div>
  </div>
  <div class="qa">
    <button data-act="addMv" data-t="in"><span class="c g">${svg('plus')}</span>Rentrée</button>
    <button data-act="addMv" data-t="out"><span class="c r">${svg('minus')}</span>Dépense</button>
    <button data-act="slip"><span class="c b">${svg('doc')}</span>Fiche de paye</button>
    <button data-act="billChoice"><span class="c o">${svg('bill')}</span>Facture</button>
  </div>
  ${!standalone() ? `<div class="card tap" style="display:flex;gap:14px;align-items:center;margin-top:16px" onclick="showIns(1)"><div class="ico">📲</div>
    <div><b>Installez Payement</b><div class="sub">Sur l'écran d'accueil, comme une vraie appli</div></div></div>` : ''}
  ${steps.some(x => !x[0]) ? `<div class="sec"><h3>Pour bien démarrer</h3></div><div class="card steps">
    ${steps.map((x, i) => `<div class="row tap" data-tab="${x[2]}"><div class="l"><span class="stepn ${x[0] ? 'ok' : ''}">${x[0] ? '✓' : i + 1}</span>
      <span class="nm" style="${x[0] ? 'text-decoration:line-through;color:var(--mute)' : ''}">${x[1]}</span></div><span class="mute">›</span></div>`).join('')}</div>` : ''}
  ${t.nb ? `<div class="sec"><h3>Factures · ${t.nbPaid}/${t.nb} payées</h3><button data-tab="bills">Tout voir</button></div>
  <div class="card">
    <div class="bar g" style="margin-top:2px"><i style="width:${t.nbPaid / t.nb * 100}%"></i></div>
    <div class="sub">${eur(t.billsPaid)} payé · <b style="color:var(--ink)">${eur(t.bills - t.billsPaid)}</b> encore à payer</div>
    ${todo.slice(0, 4).map(b => billRow(b)).join('')}
    ${todo.length > 4 ? `<div class="sub" style="text-align:center;padding-top:8px">et ${todo.length - 4} autres…</div>` : ''}
    ${!todo.length ? '<div class="empty">🎉 Tout est payé ce mois-ci !</div>' : ''}
  </div>` : ''}
  ${cats.length ? `<div class="sec"><h3>Où va l'argent</h3><button data-tab="mv">Détails</button></div><div class="card">
    ${cats.map(([c, v]) => `<div class="cat"><span class="ico" style="width:34px;height:34px;font-size:16px;border-radius:11px">${ico(CATS_OUT, c)}</span><span style="width:78px;font-weight:600">${catName(CATS_OUT, c)}</span>
    <div class="bar"><i style="width:${v / max * 100}%"></i></div><span class="amt">${eur(v)}</span></div>`).join('')}</div>` : ''}
  ${st.goals.length || st.acc.length ? `<div class="sec"><h3>Notre épargne</h3><button data-tab="goals">Voir</button></div>
  <div class="card tap" data-tab="goals">
    <div class="row" style="padding-top:0"><span class="sub">Au total</span><span class="amt sav" style="font-size:22px">${eur(totSaved)}</span></div>
    ${st.acc.map(a => `<div class="row"><div class="l"><div class="ico">${a.i || '🏦'}</div><span class="nm">${esc(a.nm)}</span></div><span class="amt">${eur(accBal(a))}</span></div>`).join('')}
    ${st.goals.map(g => { const s = goalSaved(g); return `<div class="cat"><span class="ico" style="width:34px;height:34px;font-size:16px;border-radius:11px">${g.i}</span><span style="width:78px;font-weight:600" class="nm">${esc(g.nm)}</span>
    <div class="bar b"><i style="width:${g.target ? Math.min(100, s / g.target * 100) : 0}%"></i></div><span class="amt">${eur(s)}</span></div>`; }).join('')}</div>` : ''}

let formDone = null;
function form(title, fields, vals, onOk, onDel){
  const h = fields.map(f => {
    const v = vals[f.k] ?? '';
    if (f.t === 'chips') return `<div class="f"><label>${f.l}</label><div class="chips" data-k="${f.k}">${f.o.map(o =>
      `<button type="button" data-v="${esc(o[0])}" class="${String(o[0]) === String(v) ? 'on' : ''}">${o[1]} ${o[2] || ''}</button>`).join('')}</div></div>`;
    if (f.t === 'sel') return `<div class="f"><label>${f.l}</label><select data-k="${f.k}">${f.o.map(o =>
      `<option value="${o[0]}" ${String(o[0]) === String(v) ? 'selected' : ''}>${o[1]}</option>`).join('')}</select></div>`;
    const type = f.t === 'num' ? 'text" inputmode="decimal' : (f.t || 'text');
    return `<div class="f"><label>${f.l}</label><input data-k="${f.k}" type="${type}" value="${esc(f.t === 'num' && v !== '' ? (typeof v === 'number' ? v.toFixed(2) : String(v)).replace('.', ',') : v)}" placeholder="${f.p || ''}"></div>`;
  }).join('');
  document.getElementById('sheet').innerHTML = `<h3>${title}</h3>${h}
    <div class="btns"><button class="btn alt" data-act="close">Annuler</button><button class="btn" data-act="ok">Enregistrer</button></div>
    ${onDel ? '<button class="del" data-act="delete">🗑️ Supprimer</button>' : ''}`;
  formDone = { fields, onOk, onDel };
  document.getElementById('modal').classList.add('on');
  const first = document.querySelector('#sheet input');
  if (first && !vals[first.dataset.k]) setTimeout(() => first.focus(), 150);
}
function readForm(){
  const o = {};
  document.querySelectorAll('#sheet [data-k]').forEach(el => {
    if (el.classList.contains('chips')) { const on = el.querySelector('.on'); o[el.dataset.k] = on ? on.dataset.v : ''; }
    else o[el.dataset.k] = el.value.trim();
  });
  return o;
}
function closeM(){ document.getElementById('modal').classList.remove('on'); formDone = null; if (needR) { needR = false; render(); } }
function needAmt(v){ const a = num(v); if (!(a > 0)) { toast('Indiquez un montant (ex : 45,90)'); return null; } return a; }
const monthOpts = () => { const o = []; for (let i = mi(thisMonth) - 12; i <= mi(thisMonth) + 60; i++) o.push([fromMi(i), mName(fromMi(i))]); return o; };

// Factures
function billForm(b, pre){
  const isNew = !b; b = b || Object.assign({ nm:'', amt:'', day:'', c:'loyer', freq:1, start:cur, end:'' }, pre || {});
  form(isNew ? '🧾 Nouvelle facture' : '🧾 Modifier la facture', [
    { k:'c', l:'Type', t:'chips', o:CATS_BILL },
    { k:'nm', l:'Nom', p:'ex : Loyer, Engie, Proximus…' },
    { k:'amt', l:'Montant (€)', t:'num', p:'0,00' },
    { k:'day', l:'Jour du paiement (1 à 31, facultatif)', t:'text', p:'ex : 5' },
    { k:'freq', l:'À payer', t:'sel', o:FREQ },
    { k:'start', l:'À partir de', t:'sel', o:monthOpts() },
    { k:'end', l:'Jusqu\'à (facultatif, ex : fin d\'un crédit)', t:'sel', o:[['', 'Pas de fin']].concat(monthOpts()) },
    { k:'com', l:'Communication (facultatif)', p:'+++123/4567/89012+++' },
    { k:'iban', l:'Compte à payer (IBAN, facultatif)', p:'BE00 0000 0000 0000' }
  ], b, v => {
    const amt = needAmt(v.amt); if (amt == null) return;
    const day = Math.min(31, Math.max(0, parseInt(v.day) || 0));
    if (v.end && mi(v.end) < mi(v.start)) return toast('La fin doit être après le début');
    touch(Object.assign(b, { nm: v.nm || catName(CATS_BILL, v.c), amt, day, c: v.c, freq: +v.freq, start: v.start, end: v.end, com: v.com, iban: v.iban }));
    if (isNew) { b.id = uid(); st.bills.push(b); }
    return true;
  }, isNew ? null : () => { gone(b.id); st.bills = st.bills.filter(x => x !== b); });
  if (!isNew && (b.com || b.iban)) document.querySelector('#sheet h3').insertAdjacentHTML('afterend',
    `<div class="card" style="background:var(--bg);box-shadow:none;padding:12px 14px"><div class="sub" style="margin-bottom:8px">Pour payer dans l'appli de la banque :</div><div class="chips">

  }
}

// ---------- Fiche de paye : lecture de l'image sur le téléphone (Tesseract.js), rien n'est envoyé ----------
const TESS = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
const MOIS = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const MAAND = ['januari','februari','maart','april','mei','juni','juli','augustus','september','oktober','november','december'];
function loadTess(){
  if (window.Tesseract) return Promise.resolve();
  return new Promise((ok, ko) => { const sc = document.createElement('script'); sc.src = TESS; sc.onload = ok; sc.onerror = ko; document.head.appendChild(sc); });
}
function slipProgress(t, pc, what = 'la fiche de paye'){
  document.getElementById('sheet').innerHTML = `<h3>📄 Lecture de ${what}…</h3><p class="help">${t}</p>
    <div class="bar"><i style="width:${Math.round(pc * 100)}%"></i></div>
    <p class="help">L'image reste sur votre téléphone : elle n'est envoyée nulle part.</p>`;
  document.getElementById('modal').classList.add('on'); formDone = { busy: 1 };
}
// Montants au format belge/français : 2.345,67 · 2 345,67 · 2345,67 (accepte aussi le point décimal).
function amounts(line, min = 50){
  const out = [], re = /(\d{1,3}(?:[ .'\u00a0\u202f]\d{3})+|\d+)\s?[,.]\s?(\d{2})(?![\d])/g; let x;
  while ((x = re.exec(line))) { const v = +(x[1].replace(/[^\d]/g, '') + '.' + x[2]); if (v >= min && v < 30000) out.push(v); }
  return out;
}
function parseSlip(text){
  const L = text.split(/\n/).map(l => l.trim()).filter(Boolean);
  const KW = [[/net\s*[àa@]\s*pay|net\s*[àa@]\s*vir|montant\s*[àa@]\s*vir|[àa@]\s*virer|netto\s*te\s*betalen|te\s*betalen|uit\s*te\s*betalen/i, 3],
    [/salaire\s*net|r[ée]mun[ée]ration\s*nette|montant\s*net|nettoloon|netto\s*bedrag|net\s*pay/i, 2], [/\bnet\b|\bnetto\b/i, 1]];
  const bad = /imposable|belastbaar|brut|bruto|cumul|ann[ée]e/i;
  let best = null; const all = new Map();
  L.forEach((l, i) => {
    amounts(l).forEach(v => all.set(v, (all.get(v) || 0) + 1));
    const k = KW.find(k => k[0].test(l)); if (!k) return;
    if (bad.test(l) && k[1] < 3) return;
    let a = amounts(l); if (!a.length && L[i + 1]) a = amounts(L[i + 1]);
    if (!a.length) return;
    const c = { v: a[a.length - 1], sc: k[1], i };
    if (!best || c.sc > best.sc || (c.sc === best.sc && c.i > best.i)) best = c;
  });
  // Mois de la fiche
  let month = '';
  const low = text.toLowerCase();
  const m1 = low.match(new RegExp('(' + MOIS.concat(MAAND).join('|') + ')\\s+(20\\d\\d)'));
  if (m1) { let k = MOIS.indexOf(m1[1]); if (k < 0) k = MAAND.indexOf(m1[1]); month = m1[2] + '-' + pad(k + 1); }
  else { const m2 = low.match(/\b(0[1-9]|1[0-2])\s*[\/.-]\s*(20\d\d)\b/); if (m2) month = m2[2] + '-' + m2[1]; }
  const others = [...all.keys()].filter(v => !best || v !== best.v).sort((a, b) => b - a).slice(0, 8);
  return { amt: best ? best.v : null, month, others };
}
// Lit le texte d'une image (photo ou capture), sur le téléphone.
async function ocrText(file, what){
  slipProgress('Préparation…', 0.02, what);
  await loadTess();
  const worker = await Tesseract.createWorker('fra', 1, { logger: m => {
    if (m.status === 'recognizing text') slipProgress('Lecture du texte…', 0.3 + m.progress * 0.7, what);
    else if (/load|download/i.test(m.status)) slipProgress('Préparation (la première fois, ça peut prendre un peu de temps)…', 0.05 + (m.progress || 0) * 0.25, what);
  } });
  const { data } = await worker.recognize(file);
  await worker.terminate();
  formDone = null;
  return data.text || '';
}
async function readSlip(file){
  try { slipForm(parseSlip(await ocrText(file, 'la fiche de paye'))); }
  catch(e) { formDone = null; closeM(); toast('❌ Impossible de lire l\'image (connexion ?)'); }
}

  [/proximus/i,'Proximus','internet'],[/telenet/i,'Telenet','internet'],[/\bvoo\b/i,'VOO','internet'],[/orange/i,'Orange','internet'],[/scarlet/i,'Scarlet','internet'],[/\bbase\b/i,'BASE','internet'],[/mobile\s*vikings/i,'Mobile Vikings','internet'],[/digi\b/i,'DIGI','internet'],
  [/ethias/i,'Ethias','assurance'],[/\baxa\b/i,'AXA','assurance'],[/\bag\s*insurance|\bag\b/i,'AG','assurance'],[/p\s*&\s*v|\bpv\b/i,'P&V','assurance'],[/baloise/i,'Baloise','assurance'],[/allianz/i,'Allianz','assurance'],[/fédérale|federale\s*assurance/i,'Fédérale Assurance','assurance'],
  [/mutualit|partenamut|solidaris|mutualia|helan|\bmc\b/i,'Mutuelle','assurance'],[/netflix/i,'Netflix','abonnement'],[/spotify/i,'Spotify','abonnement'],[/disney/i,'Disney+','abonnement'],
  [/fluvius/i,'Fluvius','energie'],[/belfius/i,'Belfius','credit'],[/\bkbc\b|\bcbc\b/i,'KBC','credit'],[/\bing\b/i,'ING','credit'],[/bnp|fortis/i,'BNP Paribas Fortis','credit'],
  [/taxe\s*de\s*circulation|spf\s*finances|fisc/i,'Taxe / impôts','voiture'],[/cr[èe]che|[ée]cole|garderie/i,'Crèche / école','creche'],[/loyer|bail/i,'Loyer','loyer']];
function parseBill(text){
  const L = text.split(/\n/).map(l => l.trim()).filter(Boolean), low = text.toLowerCase();
  // Montant
  const KW = [[/montant\s*[àa@]\s*pay|total\s*[àa@]\s*pay|solde\s*[àa@]\s*pay|net\s*[àa@]\s*pay|[àa@]\s*payer|montant\s*d[ûu]|te\s*betalen|amount\s*due/i, 3],
    [/total\s*(ttc|tvac|g[ée]n[ée]ral|de\s*la\s*facture)|montant\s*total|total\s*incl|totaal|^total\b/i, 2], [/total|montant/i, 1]];
  const bad = /htva|hors\s*tva|excl|tva\s*\d|d[ée]j[àa]\s*pay|acompte\s*pay|consommation\s*annuelle/i;
  let best = null; const all = new Map();
  L.forEach((l, i) => {
    amounts(l, 1).forEach(v => all.set(v, (all.get(v) || 0) + 1));
    const k = KW.find(k => k[0].test(l)); if (!k) return;
    if (bad.test(l) && k[1] < 3) return;
    let a = amounts(l, 1); if (!a.length && L[i + 1]) a = amounts(L[i + 1], 1);
    if (!a.length) return;
    const c = { v: Math.max(...a), sc: k[1] };
    if (!best || c.sc > best.sc || (c.sc === best.sc && c.v > best.v)) best = c;
  });
  // Échéance
  let due = '';
  const D = '(\\d{1,2})[\\/.\\- ](\\d{1,2}|' + MOIS.join('|') + ')[\\/.\\- ](20\\d\\d|\\d\\d)';
  const md = low.match(new RegExp('(?:[ée]ch[ée]ance|avant\\s*le|au\\s*plus\\s*tard|date\\s*limite|payer\\s*pour|pay[ée]\\s*le|vervaldag|uiterlijk|due)[^\\d]{0,25}' + D));
  if (md) { let mo = MOIS.indexOf(md[2]) + 1 || +md[2], y = +md[3]; if (y < 100) y += 2000; if (mo >= 1 && mo <= 12 && +md[1] >= 1 && +md[1] <= 31) due = y + '-' + pad(mo) + '-' + pad(+md[1]); }
  // Fournisseur
  const pv = PROV.find(p => p[0].test(text));
  let nm = pv ? pv[1] : '';
  if (!nm) { const f = L.find(l => /[a-z]{3}/i.test(l) && l.length <= 30 && !/facture|invoice|page|date|client|n°|www|@/i.test(l)); nm = f ? f.replace(/[^\p{L}\d &'.+-]/gu, '').trim() : ''; }
  // Communication structurée et compte
  const cm = text.match(/[+*]{3}\s*(\d{3})\s*\/\s*(\d{4})\s*\/\s*(\d{5})\s*[+*]{3}/);
  const ib = text.replace(/\u00a0/g, ' ').match(/\b(BE\s?\d{2}(?:\s?\d{4}){3})\b/i);
  const others = [...all.keys()].filter(v => !best || v !== best.v).sort((a, b) => b - a).slice(0, 8);
  return { amt: best ? best.v : null, due, nm, c: pv ? pv[2] : 'autre', com: cm ? `+++${cm[1]}/${cm[2]}/${cm[3]}+++` : '', iban: ib ? ib[1].toUpperCase().replace(/\s/g, '').replace(/(.{4})/g, '$1 ').trim() : '', others };
}

      ${pinMode === 'unlock' && bioId() ? '<button onclick="bioUnlock()" aria-label="Empreinte">👆</button>' : '<span></span>'}
      <button onclick="pinKey('0')">0</button><button onclick="pinKey('del')" aria-label="Effacer">⌫</button></div>
    ${pinMode === 'unlock' ? '<button class="later" onclick="pinForgot()">Code oublié ?</button>' : '<button class="later" onclick="pinCancel()">Annuler</button>'}
  </div>`;
}
async function pinKey(k){
  if (k === 'del') { pinBuf = pinBuf.slice(0, -1); return drawLock(); }
  if (pinBuf.length >= 4) return;
  if (pinMode === 'unlock' && Date.now() < pinWait) return toast('Trop d\'essais : attendez ' + Math.ceil((pinWait - Date.now()) / 1000) + ' s');
  pinBuf += k; drawLock();
  if (pinBuf.length < 4) return;
  if (pinMode === 'unlock') {
    if (await hashPin(pinBuf) === pinH()) { pinFails = 0; unlock(); }
    else { pinFails++; if (pinFails >= 5) { pinWait = Date.now() + 30000; pinFails = 0; } shake(); }
  } else if (pinMode === 'set1') { pinFirst = pinBuf; pinMode = 'set2'; pinBuf = ''; setTimeout(drawLock, 150); }
  else if (pinBuf === pinFirst) {
    try { localStorage.setItem('pay_pin', await hashPin(pinBuf)); } catch(e) {}
    profSave();
    unlock(); toast('🔒 Code enregistré');
    if (await bioAvail() && !bioId()) setTimeout(() => { if (confirm('Utiliser aussi votre empreinte de doigt (ou votre visage) pour ouvrir l\'appli ?')) bioSetup(); }, 400);
    else render();
  } else { pinMode = 'set1'; pinBuf = ''; toast('Les deux codes sont différents, recommencez'); shake(); }
}
function shake(){ pinBuf = ''; setTimeout(() => { drawLock(); const n = document.querySelector('.dots'); if (n) { n.classList.add('bad'); } }, 120); if (navigator.vibrate) navigator.vibrate(150); }
function unlock(){ document.getElementById('lock').classList.remove('on'); pinBuf = ''; onboard(); render(); }
function pinCancel(){ document.getElementById('lock').classList.remove('on'); pinBuf = ''; render(); }
function pinOff(){ if (!confirm('Enlever le code d\'accès sur ce téléphone ?')) return; try { localStorage.removeItem('pay_pin'); localStorage.removeItem('pay_bio'); } catch(e) {} profSave(); render(); toast('Code enlevé'); }
async function pinForgot(){
  if (!confirm('Code oublié ? Ce téléphone va être remis à zéro.\n\nVos chiffres restent en sécurité en ligne : il suffira de retaper votre mot de famille.')) return;
  // Le code oublié est aussi retiré du profil, sinon il serait redemandé après avoir retapé le mot de famille.
  const p = byId(st.prof, myProfId());
  if (p) { touch(Object.assign(p, { pin: '', bio: '' })); saveLocal(); try { await sync(); } catch(e) {} }
  try { Object.keys(localStorage).filter(k => k.startsWith('pay_')).forEach(k => localStorage.removeItem(k)); } catch(e) {}
  location.reload();
}
// Empreinte / visage : WebAuthn avec l'authentificateur du téléphone, vérification de l'utilisateur obligatoire.
async function bioAvail(){ try { return !!(window.PublicKeyCredential && await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable()); } catch(e) { return false; } }
async function bioSetup(){
  try {
    const c = await navigator.credentials.create({ publicKey: {
      challenge: crypto.getRandomValues(new Uint8Array(32)), rp: { name: 'Payement' },
      user: { id: crypto.getRandomValues(new Uint8Array(16)), name: me() || 'Payement', displayName: me() || 'Payement' },
      pubKeyCredParams: [{ type:'public-key', alg:-7 }, { type:'public-key', alg:-257 }],
      authenticatorSelection: { authenticatorAttachment:'platform', userVerification:'required', residentKey:'discouraged' }, timeout: 60000 } });
    localStorage.setItem('pay_bio', b64(new Uint8Array(c.rawId))); profSave(); toast('👆 Empreinte activée'); render();
  } catch(e) { toast('Empreinte pas activée'); render(); }
}
async function bioUnlock(){
  if (!bioId()) return;
  try {
    await navigator.credentials.get({ publicKey: { challenge: crypto.getRandomValues(new Uint8Array(32)),
      allowCredentials: [{ type:'public-key', id: unb64(bioId()) }], userVerification:'required', timeout: 60000 } });
    unlock();
  } catch(e) {}
}
function bioOff(){ try { localStorage.removeItem('pay_bio'); } catch(e) {} profSave(); render(); toast('Empreinte désactivée'); }

// Lien d'invitation : …/#rejoindre=CODE
function readInvite(){
  const m = location.hash.match(/rejoindre=([a-z0-9-]+)/i);
  if (!m) return '';
  history.replaceState(null, '', location.pathname);
  return m[1];
}

(async () => {
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch(e) {}
  readInvite();
  if (pinH()) lockScreen();
  render();
  await initKey();
  setSy(''); startStream(); sync().then(() => { if (SEC && me() && !byId(st.prof, myProfId())) profSave(); }); chkUpd();
  if (!showIns()) onboard();
})();
</script>
